<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Venue Reports</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #0a0a0a;
            min-height: 100vh;
            padding: 32px 16px;
            color: #f0f0f0;
        }

        .page-card {
            max-width: 760px;
            margin: 0 auto;
            background: #141414;
            border-radius: 10px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
            padding: 32px 32px 48px;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        .page-header h1 {
            font-size: 1.6rem;
            color: #fff;
            font-weight: 700;
        }

        .badge {
            background: #1db954;
            color: #000;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button {
            padding: 8px 16px;
            background-color: #222;
            color: #f0f0f0;
            border: 1px solid #333;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.15s;
        }
        button:hover { background-color: #333; }

        .back-btn { padding: 8px 14px; }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 16px;
        }

        /* Notifications */
        .notifications-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .notification-card {
            background: #1c1c1c;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .notification-card.high-reports {
            border-color: #c0392b55;
            background: #1c1414;
        }

        .notif-icon {
            font-size: 22px;
            flex-shrink: 0;
        }

        .notif-body {
            flex: 1;
            min-width: 0;
        }

        .notif-venue {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .notif-meta {
            font-size: 12px;
            color: #777;
            margin-top: 3px;
        }

        .report-count {
            font-size: 13px;
            font-weight: 600;
            color: #e74c3c;
            background: #e74c3c18;
            border: 1px solid #e74c3c33;
            border-radius: 20px;
            padding: 4px 12px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .report-count.single {
            color: #e67e22;
            background: #e67e2218;
            border-color: #e67e2233;
        }

        .delete-venue-btn {
            background: #c0392b;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s;
        }
        .delete-venue-btn:hover { background: #e74c3c; }
        .delete-venue-btn:disabled { background: #444; color: #888; cursor: default; }

        .empty-state {
            text-align: center;
            padding: 56px 20px;
            color: #555;
            font-size: 15px;
        }

        .empty-state .icon { font-size: 40px; margin-bottom: 12px; }

        .loading-state {
            text-align: center;
            padding: 56px 20px;
            color: #555;
        }

        .refresh-btn {
            background: none;
            border: 1px solid #333;
            color: #888;
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: auto;
        }
        .refresh-btn:hover { border-color: #555; color: #bbb; background: none; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .section-divider {
            border: none;
            border-top: 1px solid #2a2a2a;
            margin: 32px 0 24px;
        }

        .video-report-card {
            background: #1c1c1c;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 12px;
        }

        .video-report-top {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .video-report-info { flex: 1; min-width: 0; }

        .video-artist {
            font-size: 15px; font-weight: 600; color: #fff;
        }

        .video-id-link {
            font-size: 12px; color: #777; font-family: monospace;
            text-decoration: none;
        }
        .video-id-link:hover { color: #1db954; }

        .video-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .video-actions input {
            background: #222; color: #f0f0f0;
            border: 1px solid #444; border-radius: 4px;
            padding: 5px 9px; font-size: 13px; font-family: monospace;
            width: 160px;
        }
        .video-actions input:focus { outline: 2px solid #1db954; }

        .set-video-btn {
            background: #1db954; color: #000;
            border: none; border-radius: 4px;
            padding: 6px 12px; font-size: 13px; font-weight: 600;
            cursor: pointer;
        }
        .set-video-btn:hover { background: #17a349; }
        .set-video-btn:disabled { background: #444; color: #888; cursor: default; }

        .block-video-btn {
            background: #c0392b; color: #fff;
            border: none; border-radius: 4px;
            padding: 6px 12px; font-size: 13px; font-weight: 600;
            cursor: pointer;
        }
        .block-video-btn:hover { background: #e74c3c; }
        .block-video-btn:disabled { background: #444; color: #888; cursor: default; }

        .clear-override-btn {
            background: none; color: #888;
            border: 1px solid #444; border-radius: 4px;
            padding: 6px 10px; font-size: 12px;
            cursor: pointer;
        }
        .clear-override-btn:hover { border-color: #666; color: #bbb; }

        .override-badge {
            font-size: 11px; font-weight: 700;
            padding: 2px 8px; border-radius: 10px;
            white-space: nowrap;
        }
        .override-badge.blocked { background: #c0392b33; color: #e74c3c; border: 1px solid #c0392b55; }
        .override-badge.custom { background: #1db95433; color: #1db954; border: 1px solid #1db95455; }

        @media (max-width: 520px) {
            .page-card { padding: 20px 16px 32px; }
            .notification-card { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="page-card">
        <div class="page-header">
            <button class="back-btn" onclick="window.location.href='/upcoming-shows'">&#8592; Back</button>
            <h1>Admin</h1>
            <span class="badge">christafariii</span>
        </div>

        <div class="header-actions">
            <div class="section-title" style="margin-bottom:0;">Reported Venues</div>
            <button class="refresh-btn" id="refreshBtn">&#8635; Refresh</button>
        </div>

        <div id="notificationsContainer">
            <div class="loading-state">Loading reports&hellip;</div>
        </div>

        <hr class="section-divider">

        <div class="header-actions">
            <div class="section-title" style="margin-bottom:0;">Reported Cities</div>
            <button class="refresh-btn" id="refreshCityBtn">&#8635; Refresh</button>
        </div>
        <div id="cityReportsContainer">
            <div class="loading-state">Loading city reports&hellip;</div>
        </div>

        <hr class="section-divider">

        <div class="header-actions">
            <div class="section-title" style="margin-bottom:0;">Video Reports</div>
            <button class="refresh-btn" id="refreshVideoBtn">&#8635; Refresh</button>
        </div>
        <div id="videoReportsContainer">
            <div class="loading-state">Loading video reports&hellip;</div>
        </div>
    </div>

    <script>
        async function loadReports() {
            const container = document.getElementById('notificationsContainer');
            container.innerHTML = '<div class="loading-state">Loading reports&hellip;</div>';

            try {
                const res = await fetch('/api/venue-reports');
                if (res.status === 403) {
                    container.innerHTML = '<div class="empty-state"><div class="icon">🔒</div>Access denied.</div>';
                    return;
                }
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const reports = await res.json();

                if (reports.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="icon">✅</div>No venue reports — all clear.</div>';
                    return;
                }

                const list = document.createElement('div');
                list.className = 'notifications-list';

                reports.forEach(r => {
                    const card = document.createElement('div');
                    card.className = 'notification-card' + (r.count >= 3 ? ' high-reports' : '');
                    card.dataset.city = r.city;
                    card.dataset.venueId = r.venueId;

                    const icon = document.createElement('div');
                    icon.className = 'notif-icon';
                    icon.textContent = '⚑';

                    const body = document.createElement('div');
                    body.className = 'notif-body';

                    const venueName = document.createElement('div');
                    venueName.className = 'notif-venue';
                    venueName.textContent = r.venueName || r.venueId;

                    const meta = document.createElement('div');
                    meta.className = 'notif-meta';
                    meta.textContent = `${r.city} · ID: ${r.venueId}`;

                    body.appendChild(venueName);
                    body.appendChild(meta);

                    const countBadge = document.createElement('div');
                    countBadge.className = 'report-count' + (r.count === 1 ? ' single' : '');
                    countBadge.textContent = r.count === 1 ? '1 report' : `${r.count} reports`;

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-venue-btn';
                    deleteBtn.textContent = 'Delete Venue';
                    deleteBtn.addEventListener('click', () => deleteVenue(r.city, r.venueId, deleteBtn));

                    card.appendChild(icon);
                    card.appendChild(body);
                    card.appendChild(countBadge);
                    card.appendChild(deleteBtn);
                    list.appendChild(card);
                });

                container.innerHTML = '';
                container.appendChild(list);
            } catch (err) {
                container.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div>Failed to load reports.<br><small style="color:#555">${err.message}</small></div>`;
            }
        }

        async function deleteVenue(city, venueId, btn) {
            if (!confirm(`Delete "${venueId}" from ${city}? This will also clear all reports for it.`)) return;
            btn.disabled = true;
            btn.textContent = 'Deleting…';
            try {
                const res = await fetch(`/api/city-venues/${encodeURIComponent(city)}/venues/${encodeURIComponent(venueId)}`, {
                    method: 'DELETE'
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                // Remove the card
                const card = btn.closest('.notification-card');
                card.style.opacity = '0.4';
                card.style.pointerEvents = 'none';
                btn.textContent = 'Deleted';
                setTimeout(() => { card.remove(); checkEmpty(); }, 600);
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Delete Venue';
                alert('Failed to delete venue: ' + err.message);
            }
        }

        function checkEmpty() {
            const remaining = document.querySelectorAll('.notification-card').length;
            if (remaining === 0) {
                document.getElementById('notificationsContainer').innerHTML =
                    '<div class="empty-state"><div class="icon">✅</div>No venue reports — all clear.</div>';
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', loadReports);

        // ── City reports ──────────────────────────────────────────────────────

        async function loadCityReports() {
            const container = document.getElementById('cityReportsContainer');
            container.innerHTML = '<div class="loading-state">Loading city reports&hellip;</div>';

            try {
                const res = await fetch('/api/city-reports');
                if (res.status === 403) {
                    container.innerHTML = '<div class="empty-state"><div class="icon">🔒</div>Access denied.</div>';
                    return;
                }
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const reports = await res.json();

                if (reports.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="icon">✅</div>No city reports — all clear.</div>';
                    return;
                }

                const list = document.createElement('div');
                list.className = 'notifications-list';

                reports.forEach(r => {
                    const card = document.createElement('div');
                    card.className = 'notification-card' + (r.count >= 3 ? ' high-reports' : '');

                    const icon = document.createElement('div');
                    icon.className = 'notif-icon';
                    icon.textContent = '🏙';

                    const body = document.createElement('div');
                    body.className = 'notif-body';

                    const cityName = document.createElement('div');
                    cityName.className = 'notif-venue';
                    cityName.textContent = r.city;

                    body.appendChild(cityName);

                    const countBadge = document.createElement('div');
                    countBadge.className = 'report-count' + (r.count === 1 ? ' single' : '');
                    countBadge.textContent = r.count === 1 ? '1 report' : `${r.count} reports`;

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-venue-btn';
                    deleteBtn.textContent = 'Delete City';
                    deleteBtn.addEventListener('click', () => deleteCity(r.city, deleteBtn, card));

                    card.appendChild(icon);
                    card.appendChild(body);
                    card.appendChild(countBadge);
                    card.appendChild(deleteBtn);
                    list.appendChild(card);
                });

                container.innerHTML = '';
                container.appendChild(list);
            } catch (err) {
                container.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div>Failed to load city reports.<br><small style="color:#555">${err.message}</small></div>`;
            }
        }

        async function deleteCity(city, btn, card) {
            if (!confirm(`Delete city "${city}"? This will remove all its venues and reports.`)) return;
            btn.disabled = true;
            btn.textContent = 'Deleting…';
            try {
                const res = await fetch(`/api/city-venues/${encodeURIComponent(city)}`, { method: 'DELETE' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                card.style.opacity = '0.4';
                card.style.pointerEvents = 'none';
                btn.textContent = 'Deleted';
                setTimeout(() => { card.remove(); }, 600);
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Delete City';
                alert('Failed to delete city: ' + err.message);
            }
        }

        document.getElementById('refreshCityBtn').addEventListener('click', loadCityReports);
        loadCityReports();

        // ── Video reports ─────────────────────────────────────────────────────

        let overridesCache = {};

        async function loadVideoReports() {
            const container = document.getElementById('videoReportsContainer');
            container.innerHTML = '<div class="loading-state">Loading video reports&hellip;</div>';

            try {
                const [reportsRes, overridesRes] = await Promise.all([
                    fetch('/api/video-reports'),
                    fetch('/api/youtube-overrides')
                ]);

                if (reportsRes.status === 403) {
                    container.innerHTML = '<div class="empty-state"><div class="icon">🔒</div>Access denied.</div>';
                    return;
                }
                if (!reportsRes.ok) throw new Error(`HTTP ${reportsRes.status}`);

                const reports = await reportsRes.json();
                const overrides = overridesRes.ok ? await overridesRes.json() : [];
                overridesCache = {};
                overrides.forEach(o => { overridesCache[o.artist_name] = o; });

                if (reports.length === 0 && overrides.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="icon">✅</div>No video reports.</div>';
                    return;
                }

                // Merge: all reported artists + any with overrides
                const artistsSet = new Set(reports.map(r => r.artistName));
                overrides.forEach(o => artistsSet.add(o.artist_name));
                const allArtists = [...artistsSet];

                // Map reports by artist
                const reportsByArtist = {};
                reports.forEach(r => {
                    if (!reportsByArtist[r.artistName]) reportsByArtist[r.artistName] = [];
                    reportsByArtist[r.artistName].push(r);
                });

                container.innerHTML = '';
                allArtists.forEach(artist => {
                    const artistReports = reportsByArtist[artist] || [];
                    const override = overridesCache[artist];
                    renderVideoCard(container, artist, artistReports, override);
                });
            } catch (err) {
                container.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div>Failed to load.<br><small style="color:#555">${err.message}</small></div>`;
            }
        }

        function renderVideoCard(container, artist, reports, override) {
            const card = document.createElement('div');
            card.className = 'video-report-card';
            card.dataset.artist = artist;

            const top = document.createElement('div');
            top.className = 'video-report-top';

            const info = document.createElement('div');
            info.className = 'video-report-info';

            const nameEl = document.createElement('div');
            nameEl.className = 'video-artist';
            nameEl.textContent = artist;
            info.appendChild(nameEl);

            if (reports.length > 0) {
                const meta = document.createElement('div');
                meta.style.cssText = 'font-size:12px;color:#777;margin-top:3px;';
                const topReport = reports[0];
                const ytLink = document.createElement('a');
                ytLink.className = 'video-id-link';
                ytLink.href = `https://www.youtube.com/watch?v=${topReport.videoId}`;
                ytLink.target = '_blank';
                ytLink.rel = 'noopener noreferrer';
                ytLink.textContent = topReport.videoId;
                meta.appendChild(ytLink);
                const countSpan = document.createElement('span');
                countSpan.style.color = '#555';
                countSpan.textContent = ` · ${reports.reduce((s, r) => s + r.count, 0)} report${reports.reduce((s,r)=>s+r.count,0)===1?'':'s'}`;
                meta.appendChild(countSpan);
                info.appendChild(meta);
            }

            top.appendChild(info);

            if (override) {
                const badge = document.createElement('span');
                badge.className = 'override-badge ' + (override.removed ? 'blocked' : 'custom');
                badge.textContent = override.removed ? 'Blocked' : `Custom: ${override.video_id}`;
                top.appendChild(badge);
            }

            card.appendChild(top);

            // Actions row
            const actions = document.createElement('div');
            actions.className = 'video-actions';

            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = 'YouTube video ID';
            input.maxLength = 20;
            if (override && !override.removed && override.video_id) input.value = override.video_id;
            actions.appendChild(input);

            const setBtn = document.createElement('button');
            setBtn.className = 'set-video-btn';
            setBtn.textContent = 'Set Video';
            setBtn.addEventListener('click', async () => {
                const vid = input.value.trim();
                if (!vid) return;
                setBtn.disabled = true;
                setBtn.textContent = 'Saving…';
                try {
                    const res = await fetch('/api/youtube-overrides', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ artistName: artist, videoId: vid, removed: false })
                    });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    overridesCache[artist] = { artist_name: artist, video_id: vid, removed: false };
                    card.remove();
                    renderVideoCard(container, artist, reports, overridesCache[artist]);
                    container.insertBefore(container.lastElementChild, container.firstElementChild);
                } catch (err) { alert('Failed: ' + err.message); }
                setBtn.disabled = false;
                setBtn.textContent = 'Set Video';
            });
            actions.appendChild(setBtn);

            const blockBtn = document.createElement('button');
            blockBtn.className = 'block-video-btn';
            blockBtn.textContent = 'Block Video';
            blockBtn.addEventListener('click', async () => {
                if (!confirm(`Block all YouTube videos for "${artist}"?`)) return;
                blockBtn.disabled = true;
                blockBtn.textContent = 'Blocking…';
                try {
                    const res = await fetch('/api/youtube-overrides', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ artistName: artist, removed: true })
                    });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    overridesCache[artist] = { artist_name: artist, video_id: null, removed: true };
                    card.remove();
                    renderVideoCard(container, artist, reports, overridesCache[artist]);
                    container.insertBefore(container.lastElementChild, container.firstElementChild);
                } catch (err) { alert('Failed: ' + err.message); }
                blockBtn.disabled = false;
                blockBtn.textContent = 'Block Video';
            });
            actions.appendChild(blockBtn);

            if (override) {
                const clearBtn = document.createElement('button');
                clearBtn.className = 'clear-override-btn';
                clearBtn.textContent = 'Clear Override';
                clearBtn.addEventListener('click', async () => {
                    clearBtn.disabled = true;
                    try {
                        const res = await fetch(`/api/youtube-overrides/${encodeURIComponent(artist)}`, { method: 'DELETE' });
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        delete overridesCache[artist];
                        card.remove();
                        if (reports.length > 0) {
                            renderVideoCard(container, artist, reports, null);
                            container.appendChild(container.lastElementChild);
                        }
                    } catch (err) { alert('Failed: ' + err.message); clearBtn.disabled = false; }
                });
                actions.appendChild(clearBtn);
            }

            card.appendChild(actions);
            container.appendChild(card);
        }

        document.getElementById('refreshVideoBtn').addEventListener('click', loadVideoReports);

        loadReports();
        loadVideoReports();
    </script>
</body>
</html>

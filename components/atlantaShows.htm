<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlanta Shows</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
            min-height: 100vh;
            padding: 24px 16px;
            color: #333;
        }

        .page-card {
            max-width: 860px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            padding: 28px 28px 40px;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .page-header h1 {
            font-size: 1.7rem;
            color: #111;
        }

        button {
            padding: 8px 16px;
            background-color: #000;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background-color: #333; }

        .back-btn { padding: 8px 14px; }

        /* Filter section */
        .filter-section {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-label {
            font-size: 14px;
            font-weight: 600;
            color: #444;
            white-space: nowrap;
        }

        .dropdown-wrapper {
            position: relative;
        }

        .dropdown-trigger {
            background: white;
            border: 1px solid #ccc;
            color: #333;
            min-width: 220px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            font-size: 14px;
        }
        .dropdown-trigger:hover { background: #f5f5f5; }
        .dropdown-trigger .arrow { transition: transform 0.15s; }
        .dropdown-trigger.open .arrow { transform: rotate(180deg); }

        .dropdown-panel {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            z-index: 200;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
            min-width: 260px;
            max-height: 340px;
            overflow-y: auto;
        }
        .dropdown-panel.open { display: block; }

        .dropdown-controls {
            display: flex;
            gap: 0;
            border-bottom: 1px solid #eee;
        }
        .dropdown-ctrl-btn {
            background: none;
            border: none;
            color: #1db954;
            font-size: 12px;
            padding: 8px 14px;
            cursor: pointer;
            flex: 1;
            text-align: center;
            border-radius: 0;
        }
        .dropdown-ctrl-btn:hover { background: #f0f0f0; color: #158f3f; }
        .dropdown-ctrl-btn + .dropdown-ctrl-btn { border-left: 1px solid #eee; }

        .venue-item {
            display: flex;
            align-items: center;
            padding: 9px 14px;
            cursor: pointer;
            gap: 10px;
        }
        .venue-item:hover { background: #f7f7f7; }
        .venue-item input[type="checkbox"] {
            width: 15px;
            height: 15px;
            cursor: pointer;
            flex-shrink: 0;
            accent-color: #1db954;
        }
        .venue-item label {
            cursor: pointer;
            font-size: 14px;
            color: #222;
            line-height: 1.3;
        }

        /* Shows */
        .shows-meta {
            font-size: 13px;
            color: #888;
            margin-bottom: 14px;
            min-height: 18px;
        }

        .shows-list {
            list-style: none;
        }

        .show-item {
            display: grid;
            grid-template-columns: 96px 1fr 1fr;
            gap: 12px;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }
        .show-item:first-child { border-top: 1px solid #eee; }

        .show-date .date-main {
            font-size: 18px;
            font-weight: 700;
            color: #111;
            line-height: 1.1;
        }
        .show-date .date-sub {
            font-size: 12px;
            color: #777;
            margin-top: 2px;
        }

        .show-artist {
            font-weight: 600;
            font-size: 15px;
            color: #111;
        }

        .show-venue-name {
            font-size: 13px;
            color: #666;
            text-align: right;
        }

        .state-msg {
            text-align: center;
            padding: 48px 20px;
            color: #777;
        }
        .state-msg.error { color: #b00020; }

        .loading-dots::after {
            content: '';
            animation: dots 1.2s steps(3, end) infinite;
        }
        @keyframes dots {
            0%   { content: ''; }
            33%  { content: '.'; }
            66%  { content: '..'; }
            100% { content: '...'; }
        }

        .scrape-note {
            font-size: 12px;
            color: #aaa;
            margin-top: 8px;
        }

        .retry-link {
            display: inline-block;
            margin-top: 12px;
            color: #1db954;
            text-decoration: underline;
            font-size: 14px;
            cursor: pointer;
        }
        .retry-link:hover { color: #158f3f; }

        @media (max-width: 560px) {
            .show-item { grid-template-columns: 80px 1fr; }
            .show-venue-name { text-align: left; grid-column: 2; margin-top: -8px; }
        }
    </style>
</head>
<body>
    <div class="page-card">
        <div class="page-header">
            <button class="back-btn" id="backBtn">&#8592; Back</button>
            <h1>Atlanta Shows</h1>
        </div>

        <div class="filter-section">
            <span class="filter-label">Venues:</span>
            <div class="dropdown-wrapper" id="dropdownWrapper">
                <button class="dropdown-trigger" id="dropdownTrigger">
                    <span id="dropdownLabel">All Venues</span>
                    <span class="arrow">&#9660;</span>
                </button>
                <div class="dropdown-panel" id="dropdownPanel">
                    <div class="dropdown-controls">
                        <button class="dropdown-ctrl-btn" id="selectAllBtn">Select All</button>
                        <button class="dropdown-ctrl-btn" id="clearAllBtn">Clear All</button>
                    </div>
                    <div id="venueCheckboxes"></div>
                </div>
            </div>
        </div>

        <div id="showsMeta" class="shows-meta"></div>
        <div id="showsContainer"></div>
    </div>

    <script src="/utils.js"></script>
    <script src="/atlantaShows.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Shows Playlist</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* ── Theme tokens ── */
        :root {
            --bg: #f0f0f0;
            --card-bg: #ffffff;
            --text-primary: #111;
            --text-secondary: #555;
            --text-muted: #777;
            --border: #e8e8e8;
            --border-light: #eee;
            --surface: #fafafa;
            --surface-hover: #f5f5f5;
            --surface-item-hover: #f7f7f7;
            --dropdown-bg: #ffffff;
            --dropdown-border: #ccc;
            --input-bg: #ffffff;
            --input-border: #ccc;
            --shadow: rgba(0,0,0,0.15);
            --accent: #1db954;
            --accent-hover: #158f3f;
        }

        :root[data-theme="dark"] {
            --bg: #111113;
            --card-bg: #1c1c1f;
            --text-primary: #f0f0f0;
            --text-secondary: #aaa;
            --text-muted: #888;
            --border: rgba(255,255,255,0.1);
            --border-light: rgba(255,255,255,0.08);
            --surface: #242428;
            --surface-hover: #2a2a2e;
            --surface-item-hover: #2a2a2e;
            --dropdown-bg: #1c1c1f;
            --dropdown-border: rgba(255,255,255,0.15);
            --input-bg: #242428;
            --input-border: rgba(255,255,255,0.15);
            --shadow: rgba(0,0,0,0.4);
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg);
            min-height: 100vh;
            padding: 24px 16px;
            color: var(--text-primary);
            transition: background-color 0.2s, color 0.2s;
        }

        .page-card {
            max-width: 860px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 5px var(--shadow);
            padding: 28px 28px 40px;
            transition: background-color 0.2s;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .page-header h1 {
            font-size: 1.7rem;
            color: var(--text-primary);
        }

        button {
            padding: 8px 16px;
            background-color: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background-color: var(--surface-hover); }

        .back-btn { padding: 8px 14px; }

        .theme-toggle-btn {
            margin-left: auto;
            padding: 6px 12px;
            font-size: 12px;
            background: var(--surface);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s, color 0.15s;
        }
        .theme-toggle-btn:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
        }

        /* Filter section */
        .filter-section {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .dropdown-wrapper {
            position: relative;
        }

        .dropdown-trigger {
            background: var(--dropdown-bg);
            border: 1px solid var(--dropdown-border);
            color: var(--text-primary);
            min-width: 220px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            font-size: 14px;
        }
        .dropdown-trigger:hover { background: var(--surface-hover); }
        .dropdown-trigger .arrow { transition: transform 0.15s; }
        .dropdown-trigger.open .arrow { transform: rotate(180deg); }

        .dropdown-panel {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            z-index: 200;
            background: var(--dropdown-bg);
            border: 1px solid var(--dropdown-border);
            border-radius: 4px;
            box-shadow: 0 4px 14px var(--shadow);
            min-width: 260px;
            max-height: 340px;
            overflow-y: auto;
        }
        .dropdown-panel.open { display: block; }

        .dropdown-controls {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border-light);
        }
        .dropdown-ctrl-btn {
            background: none;
            border: none;
            color: #1db954;
            font-size: 12px;
            padding: 8px 14px;
            cursor: pointer;
            flex: 1;
            text-align: center;
            border-radius: 0;
        }
        .dropdown-ctrl-btn:hover { background: var(--surface-hover); color: var(--accent-hover); }
        .dropdown-ctrl-btn + .dropdown-ctrl-btn { border-left: 1px solid var(--border-light); }

        .venue-item {
            display: flex;
            align-items: center;
            padding: 9px 14px;
            cursor: pointer;
            gap: 10px;
        }
        .venue-item:hover { background: var(--surface-item-hover); }
        .venue-item input[type="checkbox"] {
            width: 15px;
            height: 15px;
            cursor: pointer;
            flex-shrink: 0;
            accent-color: #1db954;
        }
        .venue-item label {
            cursor: pointer;
            font-size: 14px;
            color: var(--text-primary);
            line-height: 1.3;
        }

        /* Shows */
        .shows-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 14px;
            min-height: 18px;
        }

        .shows-list {
            list-style: none;
        }

        .show-item {
            display: grid;
            grid-template-columns: 148px 1fr 1fr;
            gap: 12px;
            align-items: start;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-light);
            transition: background-color 0.2s ease;
        }
        .show-item--playing {
            background-color: rgba(30, 215, 96, 0.15);
            border-radius: 6px;
            padding-left: 8px;
            padding-right: 8px;
        }
        .show-item:first-child { border-top: 1px solid var(--border-light); }

        .show-date-cell {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .artist-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .date-link {
            color: inherit;
            text-decoration: none;
            display: block;
        }
        .date-link:hover .date-main {
            color: #1db954;
        }

        .show-date .date-main {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.1;
        }
        .show-date .date-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .show-artists {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            row-gap: 8px;
        }

        .artist-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .play-btn {
            background: none;
            border: 1px solid #1db954;
            color: #1db954;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            min-width: 28px;
            padding: 0;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
            flex-shrink: 0;
        }
        .play-btn:hover {
            background: #1db954;
            color: #fff;
        }

        .show-venue-name {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: right;
        }

        .artist-name-link {
            color: inherit;
            text-decoration: none;
        }
        .artist-name-link:hover {
            text-decoration: underline;
        }

        .venue-link {
            color: inherit;
            text-decoration: none;
        }
        .venue-link:hover {
            color: #1db954;
            text-decoration: underline;
        }

        .state-msg {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }
        .state-msg.error { color: #b00020; }

        .loading-dots::after {
            content: '';
            animation: dots 1.2s steps(3, end) infinite;
        }
        @keyframes dots {
            0%   { content: ''; }
            33%  { content: '.'; }
            66%  { content: '..'; }
            100% { content: '...'; }
        }

        .scrape-note {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .retry-link {
            display: inline-block;
            margin-top: 12px;
            color: #1db954;
            text-decoration: underline;
            font-size: 14px;
            cursor: pointer;
        }
        .retry-link:hover { color: #158f3f; }

        .artist-avatar {
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .artist-avatar:hover { opacity: 0.8; }

        /* Image popup modal */
        .img-popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .img-popup-overlay.active { display: flex; }

        .img-popup-inner {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
        }

        .img-popup-inner img {
            display: block;
            max-width: 80vw;
            max-height: 80vh;
            border-radius: 8px;
            object-fit: contain;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .img-popup-close {
            position: absolute;
            top: -14px;
            right: -14px;
            width: 32px;
            height: 32px;
            min-width: 32px;
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 50%;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .img-popup-close:hover { background: var(--surface-hover); }

        /* City / venue config section */
        .config-section {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px 16px;
            margin-bottom: 20px;
            background: var(--surface);
        }

        .config-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .config-row + .config-row {
            margin-top: 10px;
        }

        .config-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
            min-width: 100px;
        }

        .city-select {
            font-size: 14px;
            padding: 7px 10px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            background: var(--input-bg);
            color: var(--text-primary);
            cursor: pointer;
            min-width: 160px;
        }
        .city-select:focus { outline: 2px solid #1db954; outline-offset: 1px; }

        .add-btn {
            width: 30px;
            height: 30px;
            min-width: 30px;
            padding: 0;
            font-size: 20px;
            line-height: 1;
            border-radius: 50%;
            background: #1db954;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .add-btn:hover { background: #158f3f; }

        .inline-add {
            display: none;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .inline-add.visible { display: flex; }

        .inline-add input {
            font-size: 13px;
            padding: 5px 9px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            min-width: 200px;
            outline: none;
            background: var(--input-bg);
            color: var(--text-primary);
        }
        .inline-add input:focus { border-color: #1db954; }

        .inline-confirm-btn {
            background: #1db954;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 13px;
            cursor: pointer;
        }
        .inline-confirm-btn:hover { background: #158f3f; }

        .inline-cancel-btn {
            background: none;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 13px;
            cursor: pointer;
        }
        .inline-cancel-btn:hover { background: var(--surface-hover); }

        /* Scrape venue list panel */
        .scrape-venue-item {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            gap: 8px;
            font-size: 13px;
            color: var(--text-primary);
        }
        .scrape-venue-item:hover { background: var(--surface-item-hover); }

        .scrape-venue-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .scrape-venue-id {
            font-size: 11px;
            color: var(--text-muted);
            font-family: monospace;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 140px;
        }

        .report-venue-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 15px;
            line-height: 1;
            padding: 0 2px;
            flex-shrink: 0;
            transition: color 0.15s;
        }
        .report-venue-btn:hover:not(:disabled) { color: #e67e22; }
        .report-venue-btn:disabled { color: #1db954; cursor: default; }

        .admin-link {
            font-size: 12px;
            color: #1db954;
            text-decoration: none;
            margin-left: auto;
            padding: 4px 10px;
            border: 1px solid #1db954;
            border-radius: 4px;
            white-space: nowrap;
        }
        .admin-link:hover { background: #1db954; color: #fff; }

        .scrape-venue-count {
            font-size: 13px;
            color: var(--text-muted);
            padding: 6px 14px;
            border-top: 1px solid var(--border-light);
        }

        @media (max-width: 600px) {
            body { padding: 12px 8px 100px; }

            .page-card { padding: 16px 14px 32px; border-radius: 6px; }

            .page-header { gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
            .page-header h1 { font-size: 1.3rem; }
            .back-btn { padding: 6px 10px; font-size: 13px; }
            .admin-link { padding: 4px 8px; font-size: 11px; }

            .config-section { padding: 10px 12px; }
            .config-label { min-width: 60px; font-size: 12px; }
            .city-select { min-width: 120px; font-size: 13px; }
            .dropdown-trigger { min-width: 0; width: 100%; font-size: 13px; }
            .config-row { gap: 8px; }

            /* Show item: (date, venue) left col | artists right col */
            .show-item {
                grid-template-columns: 100px 1fr;
                grid-template-areas:
                    "date    artists"
                    "venue   artists";
                gap: 4px 10px;
                padding: 12px 0;
            }
            .show-date-cell { grid-area: date; align-self: start; }
            .show-venue-name {
                grid-area: venue;
                text-align: left;
                align-self: start;
                font-size: 12px;
                margin-top: 0;
            }
            .show-artists {
                grid-area: artists;
                flex-direction: column;
                align-items: flex-start;
                align-self: start;
                font-size: 14px;
                gap: 5px;
            }
            .artist-avatar { width: 30px; height: 30px; }
            .show-date .date-main { font-size: 15px; }
            .play-btn { width: 24px; height: 24px; min-width: 24px; font-size: 10px; }
        }
    </style>
</head>
<script>
    (function() {
        var t = localStorage.getItem('shows-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
    })();
</script>
<body>
    <div class="page-card">
        <div class="page-header">
            <button class="back-btn" id="backBtn">&#8592; Back</button>
            <h1>Upcoming Shows Playlist</h1>
            <a href="/admin" class="admin-link" id="adminLink" style="display:none;">Admin</a>
            <button class="theme-toggle-btn" id="themeToggle">☀ Light</button>
        </div>

        <!-- City + scraping venue config -->
        <div class="config-section">
            <div class="config-row">
                <span class="config-label">City:</span>
                <select class="city-select" id="citySelect">
                    <option value="Atlanta">Atlanta</option>
                </select>
                <button class="add-btn" id="addCityBtn" title="Add new city">+</button>
                <div class="inline-add" id="addCityInline">
                    <input type="text" id="addCityInput" placeholder="City name" maxlength="80">
                    <button class="inline-confirm-btn" id="addCityConfirm">Add</button>
                    <button class="inline-cancel-btn" id="addCityCancel">Cancel</button>
                </div>
            </div>
            <div class="config-row">
                <span class="config-label">Venues:</span>
                <div class="dropdown-wrapper" id="scrapeDropdownWrapper">
                    <button class="dropdown-trigger" id="scrapeTrigger">
                        <span id="scrapeLabel">Loading&hellip;</span>
                        <span class="arrow">&#9660;</span>
                    </button>
                    <div class="dropdown-panel" id="scrapePanel">
                        <div id="scrapeVenueList"></div>
                        <div class="scrape-venue-count" id="scrapeVenueCount"></div>
                    </div>
                </div>
                <button class="add-btn" id="addVenueBtn" title="Add venue to this city">+</button>
                <div class="inline-add" id="addVenueInline">
                    <input type="text" id="addVenueInput" placeholder="Venue ID or Spotify URL">
                    <button class="inline-confirm-btn" id="addVenueConfirm">Add</button>
                    <button class="inline-cancel-btn" id="addVenueCancel">Cancel</button>
                </div>
                <button id="triggerScrapeBtn" title="Run the scraper GitHub Action now" style="margin-left:8px;background:#1DB954;font-size:13px;padding:6px 12px;">&#9654; Check for Updates</button>
                <span id="triggerScrapeStatus" style="font-size:12px;color:#555;margin-left:6px;"></span>
            </div>
        </div>

        <div class="filter-section">
            <span class="filter-label">Filter:</span>
            <div class="dropdown-wrapper" id="dropdownWrapper">
                <button class="dropdown-trigger" id="dropdownTrigger">
                    <span id="dropdownLabel">All Venues</span>
                    <span class="arrow">&#9660;</span>
                </button>
                <div class="dropdown-panel" id="dropdownPanel">
                    <div class="dropdown-controls">
                        <button class="dropdown-ctrl-btn" id="selectAllBtn">Select All</button>
                        <button class="dropdown-ctrl-btn" id="clearAllBtn">Clear All</button>
                    </div>
                    <div id="venueCheckboxes"></div>
                </div>
            </div>
        </div>

        <div id="showsMeta" class="shows-meta"></div>
        <div id="showsContainer"></div>
    </div>

    <!-- Image popup modal -->
    <div class="img-popup-overlay" id="imgPopupOverlay">
        <div class="img-popup-inner">
            <button class="img-popup-close" id="imgPopupClose" title="Close">&times;</button>
            <img id="imgPopupImg" src="" alt="">
        </div>
    </div>

    <script src="/utils.js"></script>
    <script src="/atlantaShows.js"></script>
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>
</html>

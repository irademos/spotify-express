<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Upcoming Shows</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { overflow-x: hidden; }
        body { max-width: 100%; }

        :root {
            --bg: #f0f0f0;
            --card-bg: #ffffff;
            --text-primary: #111;
            --text-secondary: #555;
            --text-muted: #777;
            --border: #e8e8e8;
            --border-light: #eee;
            --surface: #fafafa;
            --surface-hover: #f5f5f5;
            --surface-item-hover: #f7f7f7;
            --dropdown-bg: #ffffff;
            --dropdown-border: #ccc;
            --input-bg: #ffffff;
            --input-border: #ccc;
            --shadow: rgba(0,0,0,0.15);
            --accent: #1db954;
            --accent-hover: #158f3f;
            --player-bg: #ffffff;
        }

        :root[data-theme="dark"] {
            --bg: #111113;
            --card-bg: #1c1c1f;
            --text-primary: #f0f0f0;
            --text-secondary: #aaa;
            --text-muted: #888;
            --border: rgba(255,255,255,0.1);
            --border-light: rgba(255,255,255,0.08);
            --surface: #242428;
            --surface-hover: #2a2a2e;
            --surface-item-hover: #2a2a2e;
            --dropdown-bg: #1c1c1f;
            --dropdown-border: rgba(255,255,255,0.15);
            --input-bg: #242428;
            --input-border: rgba(255,255,255,0.15);
            --shadow: rgba(0,0,0,0.4);
            --player-bg: #1c1c1f;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg);
            min-height: 100vh;
            padding: 24px 16px 160px;
            color: var(--text-primary);
            transition: background-color 0.2s, color 0.2s;
        }

        .page-card {
            max-width: 860px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 5px var(--shadow);
            padding: 28px 28px 40px;
            transition: background-color 0.2s;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .page-header h1 { font-size: 1.7rem; color: var(--text-primary); }

        button {
            padding: 8px 16px;
            background-color: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background-color: var(--surface-hover); }

        .back-btn {
            text-decoration: none;
            padding: 8px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 14px;
        }
        .back-btn:hover { background: var(--surface-hover); }

        .admin-link {
            font-size: 12px; color: #1db954; text-decoration: none;
            padding: 4px 10px;
            border: 1px solid #1db954; border-radius: 4px; white-space: nowrap;
        }
        .admin-link:hover { background: #1db954; color: #fff; }

        .report-venue-btn {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; flex-shrink: 0;
        }
        .report-venue-btn:hover:not(:disabled) { color: #e67e22; }
        .report-venue-btn:disabled { color: #1db954; cursor: default; }

        .theme-toggle-btn {
            margin-left: auto;
            padding: 6px 12px;
            font-size: 12px;
            background: var(--surface);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s, color 0.15s;
        }
        .theme-toggle-btn:hover { background: var(--surface-hover); color: var(--text-primary); }

        /* Config section */
        .config-section {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px 16px;
            margin-bottom: 20px;
            background: var(--surface);
        }

        .config-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .config-row + .config-row { margin-top: 10px; }

        .config-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
            min-width: 100px;
        }

        .city-select {
            font-size: 14px;
            padding: 7px 10px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            background: var(--input-bg);
            color: var(--text-primary);
            cursor: pointer;
            min-width: 160px;
        }
        .city-select:focus { outline: 2px solid #1db954; outline-offset: 1px; }

        .add-btn {
            width: 30px; height: 30px; min-width: 30px;
            padding: 0; font-size: 20px; line-height: 1;
            border-radius: 50%;
            background: #1db954; color: white; border: none;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .add-btn:hover { background: #158f3f; }

        .inline-add {
            display: none;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .inline-add.visible { display: flex; }

        .inline-add input {
            font-size: 13px;
            padding: 5px 9px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            min-width: 200px;
            outline: none;
            background: var(--input-bg);
            color: var(--text-primary);
        }
        .inline-add input:focus { border-color: #1db954; }

        .inline-confirm-btn {
            background: #1db954; color: white; border: none;
            border-radius: 4px; padding: 5px 10px; font-size: 13px; cursor: pointer;
        }
        .inline-confirm-btn:hover { background: #158f3f; }

        .inline-cancel-btn {
            background: none; color: var(--text-muted);
            border: 1px solid var(--border); border-radius: 4px;
            padding: 5px 10px; font-size: 13px; cursor: pointer;
        }
        .inline-cancel-btn:hover { background: var(--surface-hover); }

        /* Venue search card */
        #addVenueInline input {
            font-size: 13px; padding: 5px 9px;
            border: 1px solid var(--input-border); border-radius: 4px;
            outline: none; background: var(--input-bg); color: var(--text-primary);
        }
        #addVenueInline input:focus { border-color: #1db954; }
        .add-venue-wrapper { position: relative; }
        #addVenueInline {
            display: none; flex-direction: column; gap: 10px;
            position: absolute; top: calc(100% + 6px); left: 0; z-index: 200;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; padding: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.30);
            min-width: 360px; max-width: 480px;
        }
        #addVenueInline.visible { display: flex; }
        .venue-add-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .venue-add-or {
            display: flex; align-items: center; gap: 8px;
            color: var(--text-muted); font-size: 11px; font-weight: 700; letter-spacing: 0.07em;
        }
        .venue-add-or-line { flex: 1; height: 1px; background: var(--border); }
        .venue-search-results {
            margin-top: 4px; max-height: 220px; overflow-y: auto;
            border: 1px solid var(--border); border-radius: 6px;
        }
        .venue-search-result-item {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px; cursor: pointer;
            border-bottom: 1px solid var(--border);
            font-size: 13px; color: var(--text-primary);
        }
        .venue-search-result-item:last-child { border-bottom: none; }
        .venue-search-result-item:hover { background: var(--surface-hover); }
        .venue-search-result-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .venue-search-icon-btn {
            flex-shrink: 0; width: 26px; height: 26px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--border); border-radius: 4px;
            background: none; cursor: pointer; color: var(--text-secondary);
            font-size: 13px; text-decoration: none; line-height: 1;
        }
        .venue-search-icon-btn:hover { background: var(--surface-hover); color: var(--text-primary); }
        .venue-search-status { font-size: 12px; color: var(--text-muted); padding: 4px 2px; }

        /* Dropdowns */
        .dropdown-wrapper { position: relative; }

        .dropdown-trigger {
            background: var(--dropdown-bg);
            border: 1px solid var(--dropdown-border);
            color: var(--text-primary);
            min-width: 220px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            font-size: 14px;
        }
        .dropdown-trigger:hover { background: var(--surface-hover); }
        .dropdown-trigger .arrow { transition: transform 0.15s; }
        .dropdown-trigger.open .arrow { transform: rotate(180deg); }

        .dropdown-panel {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            z-index: 200;
            background: var(--dropdown-bg);
            border: 1px solid var(--dropdown-border);
            border-radius: 4px;
            box-shadow: 0 4px 14px var(--shadow);
            min-width: 260px;
            max-width: calc(100vw - 16px);
            max-height: 340px;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .dropdown-panel.open { display: block; }

        .dropdown-controls {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border-light);
        }
        .dropdown-ctrl-btn {
            background: none; border: none; color: #1db954;
            font-size: 12px; padding: 8px 14px; cursor: pointer;
            flex: 1; text-align: center; border-radius: 0;
        }
        .dropdown-ctrl-btn:hover { background: var(--surface-hover); color: var(--accent-hover); }
        .dropdown-ctrl-btn + .dropdown-ctrl-btn { border-left: 1px solid var(--border-light); }

        .venue-item {
            display: flex; align-items: center;
            padding: 9px 14px; cursor: pointer; gap: 10px;
        }
        .venue-item:hover { background: var(--surface-item-hover); }
        .venue-item input[type="checkbox"] {
            width: 15px; height: 15px; cursor: pointer;
            flex-shrink: 0; accent-color: #1db954;
        }
        .venue-item label { cursor: pointer; font-size: 14px; color: var(--text-primary); line-height: 1.3; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Scrape venue list */
        .scrape-venue-item {
            display: flex; align-items: center;
            padding: 8px 14px; gap: 8px;
            font-size: 13px; color: var(--text-primary);
        }
        .scrape-venue-item:hover { background: var(--surface-item-hover); }

        .scrape-venue-info {
            flex: 1; min-width: 0;
            display: flex; flex-direction: column; gap: 2px;
        }

        .scrape-venue-name {
            overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }

        .scrape-venue-id {
            font-size: 11px; color: var(--text-muted);
            font-family: monospace; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }

        .scrape-venue-count {
            font-size: 13px; color: var(--text-muted);
            padding: 6px 14px; border-top: 1px solid var(--border-light);
        }

        /* Filter section */
        .filter-section {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-label {
            font-size: 14px; font-weight: 600;
            color: var(--text-secondary); white-space: nowrap;
        }

        /* Spotify toggle button */
        .spotify-toggle-btn {
            margin-left: auto;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .spotify-toggle-btn.disconnected {
            background: var(--surface);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .spotify-toggle-btn.disconnected:hover {
            background: #1db954;
            color: #fff;
            border-color: #1db954;
        }
        .spotify-toggle-btn.connected {
            background: rgba(29,185,84,0.12);
            color: #1db954;
            border: 1px solid #1db954;
        }
        .spotify-toggle-btn.connected:hover {
            background: rgba(29,185,84,0.22);
        }
        .spotify-toggle-btn .sp-icon svg {
            width: 13px; height: 13px; fill: currentColor; display: block;
        }

        /* Shows */
        .shows-meta {
            font-size: 13px; color: var(--text-muted);
            margin-bottom: 14px; min-height: 18px;
        }

        .shows-list { list-style: none; }

        .show-item {
            display: grid;
            grid-template-columns: 148px minmax(0, 1fr) minmax(0, 1fr);
            gap: 12px;
            align-items: start;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .show-item--playing {
            background-color: rgba(30, 215, 96, 0.12);
            border-radius: 6px;
            padding-left: 8px; padding-right: 8px;
        }
        .show-item:first-child { border-top: 1px solid var(--border-light); }

        .show-date-cell { display: flex; align-items: center; gap: 8px; }

        .artist-avatar {
            width: 40px; height: 40px;
            border-radius: 50%; object-fit: cover; flex-shrink: 0;
            cursor: pointer; transition: opacity 0.15s;
        }
        .artist-avatar:hover { opacity: 0.8; }

        .show-date .date-main {
            font-size: 18px; font-weight: 700;
            color: var(--text-primary); line-height: 1.1;
        }
        .show-date .date-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        .show-artists {
            font-weight: 600; font-size: 15px;
            color: var(--text-primary);
            display: flex; flex-wrap: wrap;
            align-items: center; gap: 6px; row-gap: 8px;
            min-width: 0; overflow: hidden;
        }

        .artist-chip { display: flex; align-items: center; gap: 6px; white-space: nowrap; min-width: 0; }

        .play-btn {
            background: none;
            border: 1px solid #1db954; color: #1db954;
            border-radius: 50%;
            width: 28px; height: 28px; min-width: 28px;
            padding: 0; font-size: 11px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s, color 0.15s; flex-shrink: 0;
        }
        .play-btn:hover, .play-btn.active { background: #1db954; color: #fff; }
        .play-btn.loading {
            animation: spin 0.8s linear infinite;
            border-style: dashed;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .show-venue-name { font-size: 13px; color: var(--text-secondary); text-align: right; min-width: 0; overflow: hidden; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

        .venue-link { color: inherit; text-decoration: none; }
        .venue-link:hover { color: #1db954; text-decoration: underline; }

        .state-msg { text-align: center; padding: 48px 20px; color: var(--text-muted); }
        .state-msg.error { color: #b00020; }

        .loading-dots::after {
            content: '';
            animation: dots 1.2s steps(3, end) infinite;
        }
        @keyframes dots {
            0%   { content: ''; }
            33%  { content: '.'; }
            66%  { content: '..'; }
            100% { content: '...'; }
        }

        /* Toast */
        .toast {
            position: fixed; bottom: 80px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #333; color: #fff;
            padding: 10px 20px; border-radius: 20px;
            font-size: 13px; opacity: 0;
            transition: opacity 0.25s, transform 0.25s;
            z-index: 600; pointer-events: none; white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Floating YouTube player */
        #yt-player-card {
            position: fixed; bottom: 16px; right: 16px;
            width: 340px;
            background: var(--player-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 6px 24px var(--shadow);
            z-index: 500; display: none; overflow: hidden;
        }
        #yt-player-card.visible { display: block; }

        .yt-player-header {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 12px 8px;
            border-bottom: 1px solid var(--border-light);
        }

        .yt-now-playing-info { flex: 1; min-width: 0; cursor: pointer; user-select: none; }
        .yt-artist-name {
            font-size: 13px; font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .yt-song-name {
            font-size: 11px; color: var(--text-muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .yt-header-btns { display: flex; align-items: center; gap: 4px; }

        .yt-ctrl-btn {
            background: none; border: none; color: var(--text-secondary);
            cursor: pointer; font-size: 22px; padding: 4px 7px;
            border-radius: 4px; line-height: 1;
            transition: background 0.15s, color 0.15s;
        }
        .yt-ctrl-btn:hover { background: var(--surface-hover); color: var(--text-primary); }
        .yt-ctrl-btn.accent { color: #1db954; font-size: 26px; }
        .yt-ctrl-btn.accent:hover { background: rgba(29,185,84,0.1); }

        .yt-video-wrap { overflow: hidden; transition: height 0.25s; position: relative; }
        .yt-video-wrap.expanded { height: 192px; }
        .yt-video-wrap.collapsed { height: 0; }
        #yt-iframe-container { width: 340px; height: 191px; }

        /* Floating Spotify player */
        #sp-player-card {
            position: fixed; bottom: 16px; right: 16px;
            width: 340px;
            background: var(--player-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 6px 24px var(--shadow);
            z-index: 500; display: none; overflow: hidden;
        }
        #sp-player-card.visible { display: block; }

        .sp-player-header {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 12px 8px;
            border-bottom: 1px solid var(--border-light);
        }
        .sp-now-playing-info {
            flex: 1; min-width: 0; cursor: pointer; user-select: none;
        }
        .sp-artist-name {
            font-size: 13px; font-weight: 700; color: var(--text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .sp-song-name {
            font-size: 11px; color: var(--text-muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .sp-header-btns { display: flex; align-items: center; gap: 4px; }
        .sp-ctrl-btn {
            background: none; border: none; color: var(--text-secondary);
            cursor: pointer; font-size: 22px; padding: 4px 7px;
            border-radius: 4px; line-height: 1;
            transition: background 0.15s, color 0.15s;
        }
        .sp-ctrl-btn:hover { background: var(--surface-hover); color: var(--text-primary); }
        .sp-ctrl-btn.accent { color: #1db954; font-size: 26px; }
        .sp-ctrl-btn.accent:hover { background: rgba(29,185,84,0.1); }

        .sp-img-wrap { overflow: hidden; transition: height 0.25s; }
        .sp-img-wrap.expanded { height: 192px; }
        .sp-img-wrap.collapsed { height: 0; }
        #sp-img-container {
            width: 340px; height: 191px; position: relative;
            background: #000; overflow: hidden;
        }
        #sp-artist-img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* Image popup */
        .img-popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .img-popup-overlay.active { display: flex; }
        .img-popup-inner { position: relative; max-width: 90vw; max-height: 90vh; }
        .img-popup-inner img {
            display: block; max-width: 80vw; max-height: 80vh;
            border-radius: 8px; object-fit: contain;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .img-popup-close {
            position: absolute; top: -14px; right: -14px;
            width: 32px; height: 32px; min-width: 32px;
            background: var(--card-bg); color: var(--text-primary);
            border: 1px solid var(--border); border-radius: 50%;
            font-size: 18px; line-height: 1; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            padding: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .img-popup-close:hover { background: var(--surface-hover); }

        .img-popup-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px; height: 40px;
            background: rgba(0,0,0,0.55);
            color: #fff;
            border: none; border-radius: 50%;
            font-size: 28px; line-height: 1; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            padding: 0; z-index: 10; transition: background 0.15s;
        }
        .img-popup-nav:hover { background: rgba(0,0,0,0.8); }
        .img-popup-nav[hidden] { display: none !important; }
        .img-popup-prev { left: -50px; }
        .img-popup-next { right: -50px; }
        .img-popup-label {
            position: absolute; bottom: -28px; left: 0; right: 0;
            text-align: center; color: #fff; font-size: 13px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        /* Spotify concert icon */
        .concert-link {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px;
            color: #1db954; text-decoration: none; flex-shrink: 0;
            opacity: 0.75; transition: opacity 0.15s;
        }
        .concert-link:hover { opacity: 1; }
        .concert-link svg { width: 14px; height: 14px; fill: currentColor; }

        /* Clickable date */
        .date-link {
            color: inherit; text-decoration: none; display: block;
        }
        .date-link:hover .date-main { color: #1db954; }

        /* Links overlay inside expanded player area */
        .player-links-bar {
            display: flex; gap: 6px; padding: 6px 10px;
            background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
            flex-wrap: wrap;
        }
        .player-ext-link {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 11px; font-weight: 600; padding: 3px 8px;

        .player-ext-link.flag:hover { background: rgba(230,126,34,0.2); }
        .player-ext-link.flag:disabled { border-color: #1db954; color: #1db954; cursor: default; }

        /* YT links bar inside video area */
        #ytVideoWrap .player-links-bar {
            position: absolute; bottom: 0; left: 0; right: 0;
        }

        #sp-img-container .player-links-bar {
            position: absolute; bottom: 0; left: 0; right: 0;

        /* Location button */
        .loc-btn {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 14px; padding: 4px 5px;
            border-radius: 4px; line-height: 1;
            transition: background 0.15s, color 0.15s;
        }
        .loc-btn:hover { color: #1db954; background: rgba(29,185,84,0.1); }

        @media (max-width: 600px) {
            body { padding: 12px 8px 160px; }

            .page-card { padding: 16px 14px 32px; border-radius: 6px; }

            .page-header { gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
            .page-header h1 { font-size: 1.3rem; }
            .back-btn { padding: 6px 10px; font-size: 13px; }
            .theme-toggle-btn { padding: 5px 9px; font-size: 11px; }

            .config-section { padding: 10px 12px; }
            .config-label { min-width: 60px; font-size: 12px; }
            .city-select { min-width: 120px; font-size: 13px; }
            .dropdown-trigger { min-width: 0; width: 100%; font-size: 13px; }
            .config-row { gap: 8px; }
            #triggerScrapeBtn { font-size: 12px; padding: 5px 9px; }

            .spotify-toggle-btn { font-size: 11px; padding: 5px 10px; }

            /* Show item: (date, venue) left col | artists right col */
            .show-item {
                grid-template-columns: 100px minmax(0, 1fr);
                grid-template-areas:
                    "date    artists"
                    "venue   artists";
                gap: 4px 10px;
                padding: 12px 0;

            .show-item--playing { padding-left: 6px; padding-right: 6px; }
            .show-date-cell { grid-area: date; align-self: start; }
            .show-venue-name {
                grid-area: venue;
                text-align: left !important;
                align-self: start;

            .play-btn { width: 24px; height: 24px; min-width: 24px; font-size: 10px; }

            /* Floating player — full width, flush to bottom */
            #yt-player-card, #sp-player-card {

            #sp-img-container { width: 100%; height: auto; aspect-ratio: 16/9; }
            .sp-img-wrap.expanded { height: auto; }
        }

    <script>
    (function () {
        // ── Helpers ───────────────────────────────────────────────────────────
        function escHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

        function parseDate(datetime) {
            const datePart = datetime.split('T')[0];
            const [year, month, day] = datePart.split('-').map(Number);
            const d = new Date(Date.UTC(year, month - 1, day));
            return {
                monthStr:  MONTHS[d.getUTCMonth()],
                dayNum:    d.getUTCDate(),
                dayOfWeek: DAYS[d.getUTCDay()],
                year:      d.getUTCFullYear()
            };
        }

        function getTodayUtc() {
            const now = new Date();
            return Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
        }

        function isUpcoming(show) {
            const [year, month, day] = show.datetime.split('T')[0].split('-').map(Number);
            return Date.UTC(year, month - 1, day) >= getTodayUtc();
        }

        function extractVenueId(raw) {
            raw = raw.trim();
            const urlMatch = raw.match(/open\.spotify\.com\/venue\/([A-Za-z0-9]+)/);
            if (urlMatch) return urlMatch[1];
            const uriMatch = raw.match(/spotify:venue:([A-Za-z0-9]+)/);
            if (uriMatch) return uriMatch[1];
            if (/^[A-Za-z0-9]{10,30}$/.test(raw)) return raw;
            return null;
        }

        // ── Spotify auth helpers ──────────────────────────────────────────────
        function getSpotifyToken() {
            return document.cookie.match(/spotifyAccessToken=([^;]+)/)?.[1] || null;
        }

        async function fetchWithSpotifyAuth(url, options = {}, retry = true) {
            let token = getSpotifyToken();
            const res = await fetch(url, {
                ...options,
                headers: { ...(options.headers || {}), Authorization: `Bearer ${token}` }
            });
            if (res.status === 401 && retry) {
                const refreshToken = document.cookie.match(/spotifyRefreshToken=([^;]+)/)?.[1];
                const refreshRes = await fetch('/api/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refresh_token: refreshToken })
                });
                const refreshData = await refreshRes.json();
                if (refreshData.access_token) {
                    document.cookie = `spotifyAccessToken=${refreshData.access_token}; path=/`;
                    return fetchWithSpotifyAuth(url, options, false);
                } else {
                    throw new Error('Token refresh failed');
                }
            }
            return res;
        }

        // ── Theme ─────────────────────────────────────────────────────────────
        const themeToggle = document.getElementById('themeToggle');
        function applyTheme(t) {
            document.documentElement.setAttribute('data-theme', t);
            themeToggle.textContent = t === 'dark' ? '☀ Light' : '☾ Dark';
            localStorage.setItem('shows-theme', t);
        }
        applyTheme(localStorage.getItem('shows-theme') || 'dark');
        themeToggle.addEventListener('click', () => {
            applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        });

        // ── Player mode: 'youtube' | 'spotify' ───────────────────────────────
        // 'spotify' mode requires spotifyAccessToken cookie to be present.
        let playerMode = 'youtube';

        function isSpotifyConnected() {
            return !!getSpotifyToken() && localStorage.getItem('shows-spotify-mode') === 'on';
        }

        function updateSpotifyToggleUI() {
            const btn = document.getElementById('spotifyToggleBtn');
            const lbl = document.getElementById('spotifyToggleLabel');
            if (playerMode === 'spotify') {
                btn.classList.remove('disconnected');
                btn.classList.add('connected');
                lbl.textContent = 'Spotify Connected  ✕';
                btn.title = 'Disconnect Spotify';
            } else {
                btn.classList.remove('connected');
                btn.classList.add('disconnected');
                lbl.textContent = 'Connect Spotify';
                btn.title = 'Connect Spotify to play music directly';
            }
        }

        async function initiateSpotifyConnect() {
            try {
                const cfg = await fetch('/api/config').then(r => r.json());
                const clientId   = cfg.client_id;
                const redirectUri = cfg.redirect_uri;
                if (!clientId || !redirectUri) {
                    showToast('Spotify not configured on server');
                    return;
                }
                localStorage.setItem('shows-spotify-pending', 'true');
                const scopes = 'streaming user-read-email user-read-private user-modify-playback-state';
                const params = new URLSearchParams({
                    response_type: 'code',
                    client_id: clientId,
                    scope: scopes,
                    redirect_uri: redirectUri,
                    state: 'explore'
                });
                window.location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
            } catch (err) {
                showToast('Failed to start Spotify auth');
            }
        }

        function disconnectSpotify() {
            localStorage.removeItem('shows-spotify-mode');
            localStorage.removeItem('shows-spotify-pending');
            playerMode = 'youtube';
            if (spPlayer) { try { spPlayer.pause(); } catch (e) {} }
            spCurrentPlayingKey = null;
            spIsPlaying = false;
            document.getElementById('sp-player-card').classList.remove('visible');
            updateSpotifyToggleUI();
            renderShows();
            showToast('Spotify disconnected');
        }

        function enableSpotifyMode() {
            playerMode = 'spotify';
            localStorage.setItem('shows-spotify-mode', 'on');
            updateSpotifyToggleUI();
            renderShows();
            loadSpotifySDK();
        }

        document.getElementById('spotifyToggleBtn').addEventListener('click', () => {
            if (playerMode === 'spotify') {
                disconnectSpotify();
            } else {
                // Check if already have token
                if (getSpotifyToken()) {
                    enableSpotifyMode();
                } else {
                    initiateSpotifyConnect();
                }
            }
        });

        // Auto-enable if returning from OAuth and pending flag is set
        if (localStorage.getItem('shows-spotify-pending') === 'true' && getSpotifyToken()) {
            localStorage.removeItem('shows-spotify-pending');
            localStorage.setItem('shows-spotify-mode', 'on');
        }

        if (isSpotifyConnected()) {
            playerMode = 'spotify';
            loadSpotifySDK();
        }
        updateSpotifyToggleUI();

        // ── Image popup ───────────────────────────────────────────────────────
        const imgPopupOverlay = document.getElementById('imgPopupOverlay');
        const imgPopupImg     = document.getElementById('imgPopupImg');
        const imgPopupLabel   = document.getElementById('imgPopupLabel');
        const imgPopupPrev    = document.getElementById('imgPopupPrev');
        const imgPopupNext    = document.getElementById('imgPopupNext');

        let popupImages = [];
        let popupIndex  = 0;

        function renderPopupImage() {
            const entry = popupImages[popupIndex];
            imgPopupImg.src = entry.src;
            imgPopupImg.alt = entry.alt;
            imgPopupLabel.textContent = popupImages.length > 1
                ? `${entry.alt} (${popupIndex + 1}/${popupImages.length})` : '';
            if (imgPopupPrev) imgPopupPrev.hidden = popupIndex === 0;
            if (imgPopupNext) imgPopupNext.hidden = popupIndex === popupImages.length - 1;
        }

        function openImgPopup(images, startIndex) {
            if (typeof images === 'string') {
                popupImages = [{ src: images, alt: startIndex || '' }];
                popupIndex = 0;
            } else {
                popupImages = images.filter(i => i.src);
                popupIndex = Math.min(startIndex || 0, popupImages.length - 1);
            }
            if (!popupImages.length) return;
            renderPopupImage();
            imgPopupOverlay.classList.add('active');
        }
        function closeImgPopup() {
            imgPopupOverlay.classList.remove('active');
            imgPopupImg.src = '';
        }

        if (imgPopupPrev) imgPopupPrev.addEventListener('click', e => {
            e.stopPropagation();
            if (popupIndex > 0) { popupIndex--; renderPopupImage(); }
        });
        if (imgPopupNext) imgPopupNext.addEventListener('click', e => {
            e.stopPropagation();
            if (popupIndex < popupImages.length - 1) { popupIndex++; renderPopupImage(); }
        });

        document.getElementById('imgPopupClose').addEventListener('click', closeImgPopup);
        imgPopupOverlay.addEventListener('click', e => { if (e.target === imgPopupOverlay) closeImgPopup(); });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeImgPopup();
            if (e.key === 'ArrowLeft' && imgPopupOverlay.classList.contains('active') && popupIndex > 0) { popupIndex--; renderPopupImage(); }
            if (e.key === 'ArrowRight' && imgPopupOverlay.classList.contains('active') && popupIndex < popupImages.length - 1) { popupIndex++; renderPopupImage(); }
        });

        // ── Toast ─────────────────────────────────────────────────────────────
        let toastTimer = null;
        function showToast(msg, ms = 3000) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), ms);
        }

        // ── State ─────────────────────────────────────────────────────────────
        let allShows = [];
        let allApiVenues = [];
        let venues = [];
        let selectedVenueIds = new Set();
        let artistTopSongs = {};
        let cityVenueData = [];
        let selectedCity = 'Atlanta';
        let reportedVenueIds = new Set();
        let reportedVideoKeys = new Set();

        // ── City / venue config ───────────────────────────────────────────────
        function currentCityVenues() {
            const entry = cityVenueData.find(e => e.city === selectedCity);
            return entry ? entry.venues : [];
        }

        function renderScrapeVenues() {
            const list    = document.getElementById('scrapeVenueList');
            const countEl = document.getElementById('scrapeVenueCount');
            const labelEl = document.getElementById('scrapeLabel');
            const cityVenues = currentCityVenues();

            labelEl.textContent = cityVenues.length === 0
                ? 'No venues configured'
                : `${cityVenues.length} venue${cityVenues.length !== 1 ? 's' : ''}`;

            list.innerHTML = '';
            if (cityVenues.length === 0) {
                list.innerHTML = '<div style="padding:10px 14px;font-size:13px;color:#888;">No venues — use + to add one</div>';
                countEl.textContent = '';
                return;
            }

            const sorted = [...cityVenues].sort((a, b) => (a.name || a.id).localeCompare(b.name || b.id));
            sorted.forEach(v => {
                const row = document.createElement('div');
                row.className = 'scrape-venue-item';

                const name = document.createElement('span');
                name.className = 'scrape-venue-name';
                name.textContent = v.name || '(unnamed)';

        // ── YouTube player ────────────────────────────────────────────────────
        let ytPlayer   = null;
        let ytReady    = false;
        let videoShown = true;
        let ytActiveShowIdx    = null;
        let ytActiveArtistName = null;
        let ytActiveArtistIdx  = null;
        let ytActiveVideoId    = null;
        const showFallbackState = {};
        let pendingVideoIds = [];

        function getVisibleShows() {
            return allShows.filter(s => selectedVenueIds.has(s.venueId) && isUpcoming(s));
        }

        function ytPlayPrevArtist() {
            const visible = getVisibleShows();
            const visIdx  = visible.findIndex(s => allShows.indexOf(s) === ytActiveShowIdx);
            if (visIdx === -1) return;
            const show = visible[visIdx];
            const prevArtistIdx = (ytActiveArtistIdx ?? 0) - 1;
            if (prevArtistIdx >= 0) {
                const name  = show.artists[prevArtistIdx];
                const songs = artistTopSongs[name] || [];
                if (songs.length > 0) {
                    delete showFallbackState[ytActiveShowIdx + '|' + name];
                    ytActiveArtistIdx = prevArtistIdx;
                    ytSearchAndPlay(ytActiveShowIdx, name, songs[0]); return;
                }
            }
            const prevVisIdx = visIdx - 1;
            if (prevVisIdx >= 0) {
                const prevShow   = visible[prevVisIdx];
                const prevGlobal = allShows.indexOf(prevShow);
                const lastIdx    = prevShow.artists.length - 1;
                const name       = prevShow.artists[lastIdx];
                const songs      = artistTopSongs[name] || [];
                if (songs.length > 0) {
                    delete showFallbackState[prevGlobal + '|' + name];
                    ytActiveArtistIdx = lastIdx;
                    ytSearchAndPlay(prevGlobal, name, songs[0]);
                }
            }
        }

        function ytPlayNextArtist() {
            const visible = getVisibleShows();
            const visIdx  = visible.findIndex(s => allShows.indexOf(s) === ytActiveShowIdx);
            if (visIdx === -1) return;
            const show    = visible[visIdx];
            const nextIdx = (ytActiveArtistIdx ?? 0) + 1;
            if (nextIdx < show.artists.length) {
                const name  = show.artists[nextIdx];
                const songs = artistTopSongs[name] || [];
                if (songs.length > 0) {
                    delete showFallbackState[ytActiveShowIdx + '|' + name];
                    ytActiveArtistIdx = nextIdx;
                    ytSearchAndPlay(ytActiveShowIdx, name, songs[0]); return;
                }
            }
            const nextVisIdx = visIdx + 1;
            if (nextVisIdx < visible.length) {
                const nextShow   = visible[nextVisIdx];
                const nextGlobal = allShows.indexOf(nextShow);
                const firstName  = nextShow.artists[0];
                const songs      = artistTopSongs[firstName] || [];
                if (songs.length > 0) {
                    delete showFallbackState[nextGlobal + '|' + firstName];
                    ytActiveArtistIdx = 0;
                    ytSearchAndPlay(nextGlobal, firstName, songs[0]);
                }
            }
        }

        window.onYouTubeIframeAPIReady = function () {
            ytPlayer = new YT.Player('yt-iframe-container', {
                width: '340', height: '191',
                playerVars: { autoplay: 1, controls: 1, rel: 0, modestbranding: 1, playsinline: 1 },
                events: {
                    onReady: function () { ytReady = true; },
                    onStateChange: function (e) {
                        const btn = document.getElementById('ytPlayPauseBtn');
                        if (e.data === YT.PlayerState.PLAYING) {
                            document.getElementById('yt-player-card').classList.add('visible');
                            btn.textContent = '⏸';
                            document.querySelectorAll('.play-btn[data-mode="yt"]').forEach(b => {
                                const isActive = parseInt(b.dataset.idx) === ytActiveShowIdx
                                    && b.dataset.artist === ytActiveArtistName;
                                b.classList.toggle('active', isActive);
                                b.textContent = isActive ? '⏸' : '▶';
                            });
                            document.querySelectorAll('.show-item').forEach(li => {
                                li.classList.toggle('show-item--playing',
                                    parseInt(li.dataset.idx) === ytActiveShowIdx);
                            });
                        } else if (e.data === YT.PlayerState.PAUSED) {
                            btn.textContent = '▶';
                            document.querySelectorAll('.play-btn[data-mode="yt"].active').forEach(b => { b.textContent = '▶'; });
                            document.querySelectorAll('.show-item').forEach(li => li.classList.remove('show-item--playing'));
                        } else if (e.data === YT.PlayerState.ENDED) {
                            btn.textContent = '▶';
                            document.querySelectorAll('.play-btn[data-mode="yt"]').forEach(b => {
                                b.classList.remove('active'); b.textContent = '▶';
                            });
                            document.querySelectorAll('.show-item').forEach(li => li.classList.remove('show-item--playing'));
                            ytPlayNextArtist();
                        }
                    },
                    onError: function () { handleYtError(); }
                }
            });
        };

        function handleYtError() {
            if (ytActiveShowIdx === null) return;
            if (pendingVideoIds.length > 0) {
                const nextId = pendingVideoIds.shift();
                ytActiveVideoId = nextId;
                if (ytReady && ytPlayer) ytPlayer.loadVideoById(nextId);
                return;
            }
            const state = showFallbackState[ytActiveShowIdx + '|' + ytActiveArtistName];
            if (!state) return;
            const songs = artistTopSongs[state.artistName] || [];
            if (state.attempt === 0 && songs.length > 1) {
                state.attempt = 1;
                ytSearchAndPlay(state.showIdx, state.artistName, songs[1]);
            } else {
                showToast(`⚠ No YouTube audio found for ${state.artistName}`, 3000);
                ytClosePlayer();
                ytActiveShowIdx = null; ytActiveArtistName = null;
            }
        }

        async function ytSearchAndPlay(showIdx, artistName, songName) {
            const stateKey = showIdx + '|' + artistName;
            const songs = artistTopSongs[artistName] || [];
            showFallbackState[stateKey] = {
                showIdx, artistName,
                attempt: songName === songs[0] ? 0 : 1
            };

            document.querySelectorAll('.play-btn[data-mode="yt"]').forEach(b => {
                b.classList.remove('active'); b.textContent = '▶';
            });
            document.querySelectorAll('.show-item').forEach(li => li.classList.remove('show-item--playing'));

            const btn = document.querySelector(`.play-btn[data-mode="yt"][data-idx="${showIdx}"][data-artist="${CSS.escape(artistName)}"]`);
            if (btn) { btn.classList.add('loading'); btn.textContent = '⟳'; }

            let videoId = null;
            pendingVideoIds = [];
            try {
                const q = `${artistName} ${songName}`;
                const url = `/api/youtube-search?q=${encodeURIComponent(q)}&artist=${encodeURIComponent(artistName)}&song=${encodeURIComponent(songName)}`;
                const resp = await fetch(url);
                const data = await resp.json();
                videoId = data.videoId || null;
                if (Array.isArray(data.videoIds) && data.videoIds.length > 1) {
                    pendingVideoIds = data.videoIds.slice(1);
                }
            } catch (e) { videoId = null; }

            if (btn) { btn.classList.remove('loading'); btn.textContent = '▶'; }
            if (!videoId) { handleYtError(); return; }

            ytActiveShowIdx    = showIdx;
            ytActiveArtistName = artistName;
            ytActiveArtistIdx  = (allShows[showIdx]?.artists ?? []).indexOf(artistName);
            ytActiveVideoId    = videoId;

            const reportVideoBtn = document.getElementById('ytReportVideoBtn');
            if (reportVideoBtn) {
                const key = `${artistName}|${videoId}`;
                reportVideoBtn.textContent = reportedVideoKeys.has(key) ? '✓' : '⚑';
                reportVideoBtn.style.color = reportedVideoKeys.has(key) ? '#1db954' : 'var(--text-muted)';
                reportVideoBtn.disabled = reportedVideoKeys.has(key);
            }

            document.getElementById('ytArtistName').textContent = artistName;
            document.getElementById('ytSongName').textContent   = songName;

            const gq = encodeURIComponent(artistName + ' music');
            document.getElementById('ytExtYt').href     = `https://www.youtube.com/results?search_query=${encodeURIComponent(artistName)}`;
            document.getElementById('ytExtGoogle').href = `https://www.google.com/search?q=${gq}`;
            const show = allShows[showIdx];
            const aIdxForSpotify = (show?.artists ?? []).indexOf(artistName);
            const spId = show?.spotifyArtistIds?.[aIdxForSpotify];
            document.getElementById('ytExtSpotify').href = spId
                ? `https://open.spotify.com/artist/${spId}`
                : `https://open.spotify.com/search/${encodeURIComponent(artistName)}`;

            if (ytReady && ytPlayer) ytPlayer.loadVideoById(videoId);
        }

        function ytClosePlayer() {
            if (ytReady && ytPlayer) try { ytPlayer.stopVideo(); } catch (e) {}
            document.getElementById('yt-player-card').classList.remove('visible');
            document.querySelectorAll('.play-btn[data-mode="yt"]').forEach(b => b.classList.remove('active'));
        }

        document.getElementById('ytPlayPauseBtn').addEventListener('click', () => {
            if (!ytReady || !ytPlayer) return;
            ytPlayer.getPlayerState() === YT.PlayerState.PLAYING
                ? ytPlayer.pauseVideo()
                : ytPlayer.playVideo();
        });

        document.getElementById('ytPrevBtn').addEventListener('click', () => {
            if (ytActiveShowIdx !== null) ytPlayPrevArtist();
        });
        document.getElementById('ytNextBtn').addEventListener('click', () => {
            if (ytActiveShowIdx !== null) ytPlayNextArtist();
        });

        // Swipe left = next, swipe right = prev
        (function addYtSwipe() {
            const card = document.getElementById('yt-player-card');
            let startX = null;
            card.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
            card.addEventListener('touchend', e => {
                if (startX === null) return;
                const dx = e.changedTouches[0].clientX - startX;
                startX = null;
                if (Math.abs(dx) < 50) return;
                if (ytActiveShowIdx === null) return;
                if (dx < 0) ytPlayNextArtist(); else ytPlayPrevArtist();
            }, { passive: true });
        })();

        document.getElementById('ytReportVideoBtn').addEventListener('click', async () => {
            if (!ytActiveArtistName || !ytActiveVideoId) return;
            const key = `${ytActiveArtistName}|${ytActiveVideoId}`;
            if (reportedVideoKeys.has(key)) return;
            const btn = document.getElementById('ytReportVideoBtn');
            btn.disabled = true;
            try {
                const res = await fetch('/api/video-reports', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ artistName: ytActiveArtistName, videoId: ytActiveVideoId })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                reportedVideoKeys.add(key);
                btn.textContent = '✓';
                btn.style.color = '#1db954';
                showToast('Video reported');
            } catch (err) {
                showToast('Failed to report video');
                btn.disabled = false;
            }
        });

        function toggleYtVideo() {
            const wrap = document.getElementById('ytVideoWrap');
            const btn  = document.getElementById('ytToggleVideo');
            videoShown = !videoShown;
            wrap.classList.toggle('expanded', videoShown);
            wrap.classList.toggle('collapsed', !videoShown);
            btn.title       = videoShown ? 'Hide video' : 'Show video';
            btn.textContent = videoShown ? '▼' : '▲';
        }

        document.getElementById('ytToggleVideo').addEventListener('click', toggleYtVideo);
        document.getElementById('ytNowPlayingInfo').addEventListener('click', toggleYtVideo);

        document.getElementById('ytLocBtn').addEventListener('click', () => {
            if (ytActiveShowIdx === null) return;
            const el = document.querySelector(`.show-item[data-idx="${ytActiveShowIdx}"]`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });

        // ── Spotify player ────────────────────────────────────────────────────
        let spPlayer = null;
        let spDeviceId = null;
        let spCurrentPlayingKey = null;
        let spIsPlaying = false;
        let spLastPosition = 0;
        let spImgShown = true;
        let spSdkLoaded = false;

        function spShowKey(show) { return show.datetime + '|' + show.venue; }
        function spArtistKey(show, idx) { return spShowKey(show) + '::artist::' + idx; }

        function loadSpotifySDK() {
            if (spSdkLoaded) return;
            spSdkLoaded = true;
            const script = document.createElement('script');
            script.src = 'https://sdk.scdn.co/spotify-player.js';
            document.head.appendChild(script);
        }

        window.onSpotifyWebPlaybackSDKReady = () => {
            const token = getSpotifyToken();
            if (!token) return;
            spPlayer = new Spotify.Player({
                name: 'Upcoming Shows Player',
                getOAuthToken: cb => { cb(getSpotifyToken()); },
                volume: 0.5
            });
            spPlayer.addListener('ready', ({ device_id }) => {
                spDeviceId = device_id;
            });
            spPlayer.addListener('player_state_changed', (state) => {
                if (!state) return;
                if (spIsPlaying && state.paused && state.position === 0 && spLastPosition > 5000) {
                    spIsPlaying = false;
                    spUpdateAllPlayButtons();
                    spUpdateFloatingPlayerPlayState(false);
                    spPlayNextArtist();
                    return;
                }
                if (!state.paused) spLastPosition = state.position;
                spIsPlaying = !state.paused;
                spUpdateAllPlayButtons();
                spUpdateFloatingPlayerPlayState(spIsPlaying);
            });
            spPlayer.connect();
        };

        function spUpdateFloatingPlayer(artistName, songName, artistId, imgUrl) {
            const card = document.getElementById('sp-player-card');
            if (!card) return;
            card.classList.add('visible');
            document.getElementById('spArtistName').textContent = artistName || '—';
            document.getElementById('spSongName').textContent   = songName   || '—';
            const img = document.getElementById('sp-artist-img');
            if (img) { img.src = imgUrl || ''; img.style.display = imgUrl ? 'block' : 'none'; }
            const yt = document.getElementById('spExtYt');
            const gg = document.getElementById('spExtGoogle');
            const sp = document.getElementById('spExtSpotify');
            if (yt) yt.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(artistName)}`;
            if (gg) gg.href = `https://www.google.com/search?q=${encodeURIComponent(artistName + ' music')}`;
            if (sp) sp.href = artistId
                ? `https://open.spotify.com/artist/${artistId}`
                : `https://open.spotify.com/search/${encodeURIComponent(artistName)}`;
        }

        function spUpdateFloatingPlayerPlayState(playing) {
            const btn = document.getElementById('spPlayPauseBtn');
            if (btn) btn.textContent = playing ? '⏸' : '▶';
        }

        function spUpdateAllPlayButtons() {
            document.querySelectorAll('.play-btn[data-mode="sp"]').forEach(btn => {
                const active = btn.dataset.key === spCurrentPlayingKey && spIsPlaying;
                btn.textContent = active ? '⏸' : '▶';
                btn.classList.toggle('active', active);
            });
            const activeShowKey = spCurrentPlayingKey && spIsPlaying
                ? spCurrentPlayingKey.slice(0, spCurrentPlayingKey.indexOf('::artist::'))
                : null;
            document.querySelectorAll('.show-item').forEach(li => {
                li.classList.toggle('show-item--playing', li.dataset.showKey === activeShowKey);
            });
        }

        function spPlayNextArtist() {
            if (!spCurrentPlayingKey) return;
            const sep = '::artist::';
            const sepIdx = spCurrentPlayingKey.indexOf(sep);
            const showPart = spCurrentPlayingKey.slice(0, sepIdx);
            const artistIdx = parseInt(spCurrentPlayingKey.slice(sepIdx + sep.length));
            const visible = getVisibleShows();
            const currentShowIdx = visible.findIndex(s => spShowKey(s) === showPart);
            if (currentShowIdx === -1) { spCurrentPlayingKey = null; spUpdateAllPlayButtons(); return; }
            const currentShow = visible[currentShowIdx];
            const nextArtistIdx = artistIdx + 1;
            if (nextArtistIdx < currentShow.artists.length) { spPlayShow(currentShow, nextArtistIdx); return; }
            const nextShowIdx = currentShowIdx + 1;
            if (nextShowIdx < visible.length) {
                spPlayShow(visible[nextShowIdx], 0);
            } else {
                spCurrentPlayingKey = null; spUpdateAllPlayButtons();
            }
        }

        function spPlayPrevArtist() {
            if (!spCurrentPlayingKey) return;
            const sep = '::artist::';
            const sepIdx = spCurrentPlayingKey.indexOf(sep);
            const showPart = spCurrentPlayingKey.slice(0, sepIdx);
            const artistIdx = parseInt(spCurrentPlayingKey.slice(sepIdx + sep.length));
            const visible = getVisibleShows();
            const currentShow = visible.find(s => spShowKey(s) === showPart);
            if (!currentShow) return;
            const prevIdx = artistIdx - 1;
            if (prevIdx >= 0) { spPlayShow(currentShow, prevIdx); return; }
            const visIdx = visible.indexOf(currentShow);
            if (visIdx > 0) { const prev = visible[visIdx - 1]; spPlayShow(prev, prev.artists.length - 1); }
        }

        function normalizeArtistName(name) {
            return name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
        }

        async function spPlayShow(show, artistIdx = 0) {
            if (!spDeviceId) {
                showToast('Spotify player not ready yet. Please wait a moment.');
                return;
            }
            spLastPosition = 0;
            const artistName = show.artists[artistIdx];
            const key = spArtistKey(show, artistIdx);
            try {
                let artistId = show.spotifyArtistIds?.[artistIdx] || null;
                if (!artistId) {
                    const searchRes = await fetchWithSpotifyAuth(
                        `https://api.spotify.com/v1/search?q=${encodeURIComponent('"' + artistName + '"')}&type=artist&limit=10`
                    );
                    const searchData = await searchRes.json();
                    const items = searchData.artists?.items || [];
                    const normalTarget = normalizeArtistName(artistName);
                    const exactMatch = items.find(a => normalizeArtistName(a.name) === normalTarget);
                    if (exactMatch) {
                        artistId = exactMatch.id;
                    } else {
                        const sorted = [...items].sort((a, b) => b.popularity - a.popularity);
                        artistId = sorted[0]?.id || null;
                    }
                    if (artistId) {
                        if (!show.spotifyArtistIds) show.spotifyArtistIds = [];
                        show.spotifyArtistIds[artistIdx] = artistId;
                        fetch('/api/cache-artist-id', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name: artistName, spotifyId: artistId })
                        }).catch(() => {});
                    }
                }
                if (!artistId) return;
                const tracksRes = await fetchWithSpotifyAuth(
                    `https://api.spotify.com/v1/artists/${artistId}/top-tracks?market=US`
                );
                const tracksData = await tracksRes.json();
                const trackUri = tracksData.tracks?.[0]?.uri;
                if (!trackUri) return;
                await fetchWithSpotifyAuth(
                    `https://api.spotify.com/v1/me/player/play?device_id=${spDeviceId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uris: [trackUri] })
                });
                spCurrentPlayingKey = key;
                spIsPlaying = true;
                spUpdateAllPlayButtons();
                spUpdateFloatingPlayerPlayState(true);
                const trackName = tracksData.tracks?.[0]?.name || '';
                const imgUrl = (show.artistAvatarUrls && show.artistAvatarUrls[artistIdx]) || show.firstArtistAvatarUrl || '';
                spUpdateFloatingPlayer(artistName, trackName, artistId, imgUrl);
            } catch (err) {
                console.error('Error playing artist via Spotify:', artistName, err);
                showToast('Spotify play failed — try again');
            }
        }

        // Wire Spotify floating player controls
        document.getElementById('spPlayPauseBtn').addEventListener('click', () => {
            if (spIsPlaying) { spPlayer?.pause(); } else { spPlayer?.resume(); }
        });
        document.getElementById('spPrevBtn').addEventListener('click', () => { spPlayPrevArtist(); });
        document.getElementById('spNextBtn').addEventListener('click', () => { spPlayNextArtist(); });

        // Swipe left = next, swipe right = prev
        (function addSpSwipe() {
            const card = document.getElementById('sp-player-card');
            let startX = null;
            card.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
            card.addEventListener('touchend', e => {
                if (startX === null) return;
                const dx = e.changedTouches[0].clientX - startX;
                startX = null;
                if (Math.abs(dx) < 50) return;
                if (dx < 0) spPlayNextArtist(); else spPlayPrevArtist();
            }, { passive: true });
        })();

        (function wireSpToggle() {
            function toggleSpImg() {
                const wrap = document.getElementById('spImgWrap');
                const btn  = document.getElementById('spToggleImg');
                spImgShown = !spImgShown;
                wrap?.classList.toggle('expanded', spImgShown);
                wrap?.classList.toggle('collapsed', !spImgShown);
                if (btn) btn.textContent = spImgShown ? '▼' : '▲';
            }
            document.getElementById('spToggleImg').addEventListener('click', toggleSpImg);
            document.getElementById('spNowPlayingInfo').addEventListener('click', toggleSpImg);
        })();

        document.getElementById('spLocBtn').addEventListener('click', () => {
            if (!spCurrentPlayingKey) return;
            const showPart = spCurrentPlayingKey.slice(0, spCurrentPlayingKey.indexOf('::artist::'));
            const el = document.querySelector(`.show-item[data-showKey="${CSS.escape(showPart)}"]`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });

        // ── Shows rendering ───────────────────────────────────────────────────
        function renderShows() {
            const container = document.getElementById('showsContainer');
            const meta      = document.getElementById('showsMeta');
            const visible   = getVisibleShows();

            if (visible.length === 0) {
                meta.textContent = '';
                container.innerHTML = allShows.length === 0
                    ? '<div class="state-msg">No shows loaded yet.</div>'
                    : '<div class="state-msg">No shows match the selected venues.</div>';
                return;
            }

            meta.textContent = `${visible.length} show${visible.length !== 1 ? 's' : ''}`;

            const ul = document.createElement('ul');
            ul.className = 'shows-list';

            visible.forEach((show) => {
                const globalIdx = allShows.indexOf(show);
                const date = parseDate(show.datetime);
                const li = document.createElement('li');
                li.className = 'show-item';
                li.dataset.idx     = globalIdx;
                li.dataset.showKey = spShowKey(show);

                // Highlight if playing
                if (playerMode === 'youtube' && ytActiveShowIdx === globalIdx) {
                    li.classList.add('show-item--playing');
                } else if (playerMode === 'spotify') {
                    const sKey = spShowKey(show);
                    if (spCurrentPlayingKey && spIsPlaying && spCurrentPlayingKey.startsWith(sKey + '::artist::')) {
                        li.classList.add('show-item--playing');
                    }
                }

                // Date + avatar cell
                const dateCell = document.createElement('div');
                dateCell.className = 'show-date-cell';
                const firstImg = show.firstArtistAvatarUrl || (show.artistAvatarUrls && show.artistAvatarUrls[0]) || null;
                if (firstImg) {
                    const img = document.createElement('img');
                    img.className = 'artist-avatar'; img.src = firstImg;
                    img.alt = show.artists[0] || ''; img.loading = 'lazy';
                    img.addEventListener('click', () => {
                        const images = (show.artistAvatarUrls || [show.firstArtistAvatarUrl])
                            .map((src, i) => ({ src: src || '', alt: show.artists[i] || '' }))
                            .filter(i => i.src);
                        openImgPopup(images.length ? images : [{ src: firstImg, alt: show.artists[0] || '' }], 0);
                    });
                    dateCell.appendChild(img);
                }

                const googleQuery = `${date.monthStr} ${date.dayNum} ${date.year} ${show.artists[0] || ''} ${show.venue}`;
                const dateLink = document.createElement('a');
                dateLink.className = 'date-link';
                dateLink.href = `https://www.google.com/search?q=${encodeURIComponent(googleQuery)}`;
                dateLink.target = '_blank'; dateLink.rel = 'noopener noreferrer';
                const dateDiv = document.createElement('div');
                dateDiv.className = 'show-date';
                dateDiv.innerHTML = `<div class="date-main">${escHtml(date.monthStr)} ${date.dayNum}</div><div class="date-sub">${date.dayOfWeek}, ${date.year}</div>`;
                dateLink.appendChild(dateDiv);
                dateCell.appendChild(dateLink);
                li.appendChild(dateCell);

                // Artists cell
                const artistsDiv = document.createElement('div');
                artistsDiv.className = 'show-artists';

                show.artists.forEach((name, aIdx) => {
                    const songs = artistTopSongs[name] || [];
                    const chip  = document.createElement('span');
                    chip.className = 'artist-chip';

                    if (playerMode === 'youtube' && songs.length > 0) {
                        // YouTube play button
                        const btn = document.createElement('button');
                        btn.className = 'play-btn';
                        btn.dataset.mode   = 'yt';
                        btn.dataset.idx    = globalIdx;
                        btn.dataset.artist = name;
                        btn.title = `Play: ${songs[0]}`;
                        btn.textContent = '▶';
                        if (ytActiveShowIdx === globalIdx && ytActiveArtistName === name) btn.classList.add('active');
                        btn.addEventListener('click', () => {
                            if (ytActiveShowIdx === globalIdx && ytActiveArtistName === name) {
                                document.getElementById('ytPlayPauseBtn').click(); return;
                            }
                            delete showFallbackState[globalIdx + '|' + name];
                            ytSearchAndPlay(globalIdx, name, songs[0]);
                        });
                        chip.appendChild(btn);
                    } else if (playerMode === 'spotify') {
                        // Spotify play button
                        const key = spArtistKey(show, aIdx);
                        const btn = document.createElement('button');
                        btn.className = 'play-btn';
                        btn.dataset.mode = 'sp';
                        btn.dataset.key  = key;
                        btn.textContent = (key === spCurrentPlayingKey && spIsPlaying) ? '⏸' : '▶';
                        btn.classList.toggle('active', key === spCurrentPlayingKey && spIsPlaying);
                        btn.addEventListener('click', async () => {
                            if (key === spCurrentPlayingKey) {
                                if (spIsPlaying) {
                                    spPlayer?.pause(); spIsPlaying = false; spUpdateAllPlayButtons();
                                } else {
                                    spPlayer?.resume(); spIsPlaying = true; spUpdateAllPlayButtons();
                                }
                            } else {
                                spCurrentPlayingKey = null; spIsPlaying = false; spUpdateAllPlayButtons();
                                await spPlayShow(show, aIdx);
                            }
                        });
                        chip.appendChild(btn);
                    }

                    const nameLink = document.createElement('a');
                    nameLink.textContent = name;
                    nameLink.target = '_blank'; nameLink.rel = 'noopener noreferrer';
                    nameLink.style.cssText = 'color:inherit;text-decoration:none;';
                    if (playerMode === 'youtube' && songs.length === 0) {
                        nameLink.style.color = 'var(--text-secondary)';
                    }
                    const spotifyId = show.spotifyArtistIds?.[aIdx];
                    nameLink.href = spotifyId
                        ? `https://open.spotify.com/artist/${spotifyId}`
                        : `https://open.spotify.com/search/${encodeURIComponent(name)}`;
                    nameLink.addEventListener('mouseover', () => nameLink.style.textDecoration = 'underline');
                    nameLink.addEventListener('mouseout',  () => nameLink.style.textDecoration = 'none');
                    chip.appendChild(nameLink);

                    if (aIdx < show.artists.length - 1) {
                        const sep = document.createElement('span');
                        sep.className = 'artist-chip-sep';
                        sep.textContent = '·';
                        sep.style.cssText = 'color:var(--text-muted);font-weight:400;margin:0 2px';
                        chip.appendChild(sep);
                    }

                    artistsDiv.appendChild(chip);
                });
                li.appendChild(artistsDiv);

                // Venue cell
                const venueDiv = document.createElement('div');
                venueDiv.className = 'show-venue-name';
                venueDiv.style.cssText = 'display:flex;flex-direction:column;gap:4px;';
                const venueLink = document.createElement('a');
                venueLink.className = 'venue-link';
                venueLink.textContent = show.venue;
                venueLink.href = `https://www.google.com/maps/search/${encodeURIComponent(show.venue + ' ' + selectedCity)}`;
                venueLink.target = '_blank'; venueLink.rel = 'noopener noreferrer';
                venueDiv.appendChild(venueLink);

                if (show.concertUri) {
                    const concertId = show.concertUri.split(':')[2];
                    const spotifyBtn = document.createElement('a');
                    spotifyBtn.className = 'concert-link';
                    spotifyBtn.href = `https://open.spotify.com/concert/${concertId}`;
                    spotifyBtn.target = '_blank'; spotifyBtn.rel = 'noopener noreferrer';
                    spotifyBtn.title = 'View on Spotify';
                    spotifyBtn.innerHTML = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>`;
                    venueDiv.appendChild(spotifyBtn);
                }

                li.appendChild(venueDiv);
                ul.appendChild(li);
            });

            container.innerHTML = '';
            container.appendChild(ul);
        }

        // ── Load shows ────────────────────────────────────────────────────────
        function loadShows(url) {
            document.getElementById('showsContainer').innerHTML =
                '<div class="state-msg"><span class="loading-dots">Loading</span></div>';
            document.getElementById('showsMeta').textContent = '';

            fetch(url)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    allShows = (data.shows || []).map(show => {
                        if (!show.artists) show.artists = show.artist ? [show.artist] : [];
                        if (!show.spotifyArtistIds && show.spotifyArtistId)
                            show.spotifyArtistIds = [show.spotifyArtistId];
                        return show;
                    });

                    artistTopSongs = data.artistTopSongs || {};

                    const rawVenues = data.venues || [];
                    allApiVenues = rawVenues
                        .filter(v => v.name != null)
                        .map(v => ({ id: v.id, name: v.name, displayName: v.name }))
                        .sort((a, b) => a.displayName.localeCompare(b.displayName));

                    if (allApiVenues.length === 0 && rawVenues.length > 0) {
                        allApiVenues = rawVenues.map((v, i) => ({ id: v.id, name: v.id, displayName: `Venue ${i + 1}` }));
                    }

                    rebuildVenuesForCity();
                })
                .catch(err => {
                    document.getElementById('showsContainer').innerHTML =
                        `<div class="state-msg error">Failed to load shows.<br><small>${escHtml(err.message)}</small></div>`;
                });
        }

        // ── Init ──────────────────────────────────────────────────────────────
        fetch('/api/is-admin').then(r => r.json()).then(d => {
            if (d.isAdmin) document.getElementById('adminLink').style.display = '';
        }).catch(() => {});

        loadCityVenues();
        loadShows(`/api/shows/${encodeURIComponent(selectedCity)}`);
    })();
    </script>

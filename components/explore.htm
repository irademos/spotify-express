<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Upcoming Shows</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f0f0f0;
            --card-bg: #ffffff;
            --text-primary: #111;
            --text-secondary: #555;
            --text-muted: #777;
            --border: #e8e8e8;
            --border-light: #eee;
            --surface: #fafafa;
            --surface-hover: #f5f5f5;
            --surface-item-hover: #f7f7f7;
            --dropdown-bg: #ffffff;
            --dropdown-border: #ccc;
            --input-bg: #ffffff;
            --input-border: #ccc;
            --shadow: rgba(0,0,0,0.15);
            --accent: #1db954;
            --accent-hover: #158f3f;
            --player-bg: #ffffff;
        }

        :root[data-theme="dark"] {
            --bg: #111113;
            --card-bg: #1c1c1f;
            --text-primary: #f0f0f0;
            --text-secondary: #aaa;
            --text-muted: #888;
            --border: rgba(255,255,255,0.1);
            --border-light: rgba(255,255,255,0.08);
            --surface: #242428;
            --surface-hover: #2a2a2e;
            --surface-item-hover: #2a2a2e;
            --dropdown-bg: #1c1c1f;
            --dropdown-border: rgba(255,255,255,0.15);
            --input-bg: #242428;
            --input-border: rgba(255,255,255,0.15);
            --shadow: rgba(0,0,0,0.4);
            --player-bg: #1c1c1f;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg);
            min-height: 100vh;
            padding: 24px 16px 120px;
            color: var(--text-primary);
            transition: background-color 0.2s, color 0.2s;
        }

        .page-card {
            max-width: 860px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 5px var(--shadow);
            padding: 28px 28px 40px;
            transition: background-color 0.2s;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .page-header h1 { font-size: 1.7rem; color: var(--text-primary); }

        button {
            padding: 8px 16px;
            background-color: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background-color: var(--surface-hover); }

        .back-btn {
            text-decoration: none;
            padding: 8px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 14px;
        }
        .back-btn:hover { background: var(--surface-hover); }

        .theme-toggle-btn {
            margin-left: auto;
            padding: 6px 12px;
            font-size: 12px;
            background: var(--surface);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s, color 0.15s;
        }
        .theme-toggle-btn:hover { background: var(--surface-hover); color: var(--text-primary); }

        /* Config section */
        .config-section {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px 16px;
            margin-bottom: 20px;
            background: var(--surface);
        }

        .config-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .config-row + .config-row { margin-top: 10px; }

        .config-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
            min-width: 100px;
        }

        .city-select {
            font-size: 14px;
            padding: 7px 10px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            background: var(--input-bg);
            color: var(--text-primary);
            cursor: pointer;
            min-width: 160px;
        }
        .city-select:focus { outline: 2px solid #1db954; outline-offset: 1px; }

        .add-btn {
            width: 30px; height: 30px; min-width: 30px;
            padding: 0; font-size: 20px; line-height: 1;
            border-radius: 50%;
            background: #1db954; color: white; border: none;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .add-btn:hover { background: #158f3f; }

        .inline-add {
            display: none;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .inline-add.visible { display: flex; }

        .inline-add input {
            font-size: 13px;
            padding: 5px 9px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            min-width: 200px;
            outline: none;
            background: var(--input-bg);
            color: var(--text-primary);
        }
        .inline-add input:focus { border-color: #1db954; }

        .inline-confirm-btn {
            background: #1db954; color: white; border: none;
            border-radius: 4px; padding: 5px 10px; font-size: 13px; cursor: pointer;
        }
        .inline-confirm-btn:hover { background: #158f3f; }

        .inline-cancel-btn {
            background: none; color: var(--text-muted);
            border: 1px solid var(--border); border-radius: 4px;
            padding: 5px 10px; font-size: 13px; cursor: pointer;
        }
        .inline-cancel-btn:hover { background: var(--surface-hover); }

        /* Dropdowns */
        .dropdown-wrapper { position: relative; }

        .dropdown-trigger {
            background: var(--dropdown-bg);
            border: 1px solid var(--dropdown-border);
            color: var(--text-primary);
            min-width: 220px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            font-size: 14px;
        }
        .dropdown-trigger:hover { background: var(--surface-hover); }
        .dropdown-trigger .arrow { transition: transform 0.15s; }
        .dropdown-trigger.open .arrow { transform: rotate(180deg); }

        .dropdown-panel {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            z-index: 200;
            background: var(--dropdown-bg);
            border: 1px solid var(--dropdown-border);
            border-radius: 4px;
            box-shadow: 0 4px 14px var(--shadow);
            min-width: 260px;
            max-height: 340px;
            overflow-y: auto;
        }
        .dropdown-panel.open { display: block; }

        .dropdown-controls {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border-light);
        }
        .dropdown-ctrl-btn {
            background: none; border: none; color: #1db954;
            font-size: 12px; padding: 8px 14px; cursor: pointer;
            flex: 1; text-align: center; border-radius: 0;
        }
        .dropdown-ctrl-btn:hover { background: var(--surface-hover); color: var(--accent-hover); }
        .dropdown-ctrl-btn + .dropdown-ctrl-btn { border-left: 1px solid var(--border-light); }

        .venue-item {
            display: flex; align-items: center;
            padding: 9px 14px; cursor: pointer; gap: 10px;
        }
        .venue-item:hover { background: var(--surface-item-hover); }
        .venue-item input[type="checkbox"] {
            width: 15px; height: 15px; cursor: pointer;
            flex-shrink: 0; accent-color: #1db954;
        }
        .venue-item label { cursor: pointer; font-size: 14px; color: var(--text-primary); line-height: 1.3; }

        /* Scrape venue list */
        .scrape-venue-item {
            display: flex; align-items: center;
            padding: 8px 14px; gap: 8px;
            font-size: 13px; color: var(--text-primary);
        }
        .scrape-venue-item:hover { background: var(--surface-item-hover); }

        .scrape-venue-name {
            flex: 1; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }

        .scrape-venue-id {
            font-size: 11px; color: var(--text-muted);
            font-family: monospace; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
            max-width: 140px;
        }

        .scrape-venue-count {
            font-size: 13px; color: var(--text-muted);
            padding: 6px 14px; border-top: 1px solid var(--border-light);
        }

        /* Filter section */
        .filter-section {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-label {
            font-size: 14px; font-weight: 600;
            color: var(--text-secondary); white-space: nowrap;
        }

        /* Shows */
        .shows-meta {
            font-size: 13px; color: var(--text-muted);
            margin-bottom: 14px; min-height: 18px;
        }

        .shows-list { list-style: none; }

        .show-item {
            display: grid;
            grid-template-columns: 148px 1fr 1fr;
            gap: 12px;
            align-items: start;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .show-item--playing {
            background-color: rgba(30, 215, 96, 0.12);
            border-radius: 6px;
            padding-left: 8px; padding-right: 8px;
        }
        .show-item:first-child { border-top: 1px solid var(--border-light); }

        .show-date-cell { display: flex; align-items: center; gap: 8px; }

        .artist-avatar {
            width: 40px; height: 40px;
            border-radius: 50%; object-fit: cover; flex-shrink: 0;
            cursor: pointer; transition: opacity 0.15s;
        }
        .artist-avatar:hover { opacity: 0.8; }

        .show-date .date-main {
            font-size: 18px; font-weight: 700;
            color: var(--text-primary); line-height: 1.1;
        }
        .show-date .date-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        .show-artists {
            font-weight: 600; font-size: 15px;
            color: var(--text-primary);
            display: flex; flex-wrap: wrap;
            align-items: center; gap: 6px; row-gap: 8px;
        }

        .artist-chip { display: flex; align-items: center; gap: 6px; white-space: nowrap; }

        .play-btn {
            background: none;
            border: 1px solid #1db954; color: #1db954;
            border-radius: 50%;
            width: 28px; height: 28px; min-width: 28px;
            padding: 0; font-size: 11px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s, color 0.15s; flex-shrink: 0;
        }
        .play-btn:hover, .play-btn.active { background: #1db954; color: #fff; }
        .play-btn.loading {
            animation: spin 0.8s linear infinite;
            border-style: dashed;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .show-venue-name { font-size: 13px; color: var(--text-secondary); text-align: right; }

        .venue-link { color: inherit; text-decoration: none; }
        .venue-link:hover { color: #1db954; text-decoration: underline; }

        .state-msg { text-align: center; padding: 48px 20px; color: var(--text-muted); }
        .state-msg.error { color: #b00020; }

        .loading-dots::after {
            content: '';
            animation: dots 1.2s steps(3, end) infinite;
        }
        @keyframes dots {
            0%   { content: ''; }
            33%  { content: '.'; }
            66%  { content: '..'; }
            100% { content: '...'; }
        }

        /* Toast */
        .toast {
            position: fixed; bottom: 80px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #333; color: #fff;
            padding: 10px 20px; border-radius: 20px;
            font-size: 13px; opacity: 0;
            transition: opacity 0.25s, transform 0.25s;
            z-index: 600; pointer-events: none; white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Floating YouTube player */
        #yt-player-card {
            position: fixed; bottom: 16px; right: 16px;
            width: 340px;
            background: var(--player-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 6px 24px var(--shadow);
            z-index: 500; display: none; overflow: hidden;
        }
        #yt-player-card.visible { display: block; }

        .yt-player-header {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 12px 8px;
            border-bottom: 1px solid var(--border-light);
        }

        .yt-now-playing-info { flex: 1; min-width: 0; }
        .yt-artist-name {
            font-size: 13px; font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .yt-song-name {
            font-size: 11px; color: var(--text-muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .yt-header-btns { display: flex; align-items: center; gap: 4px; }

        .yt-ctrl-btn {
            background: none; border: none; color: var(--text-secondary);
            cursor: pointer; font-size: 16px; padding: 4px 6px;
            border-radius: 4px; line-height: 1;
            transition: background 0.15s, color 0.15s;
        }
        .yt-ctrl-btn:hover { background: var(--surface-hover); color: var(--text-primary); }
        .yt-ctrl-btn.accent { color: #1db954; font-size: 18px; }
        .yt-ctrl-btn.accent:hover { background: rgba(29,185,84,0.1); }

        .yt-video-wrap { overflow: hidden; transition: height 0.25s; }
        .yt-video-wrap.expanded { height: 192px; }
        .yt-video-wrap.collapsed { height: 0; }
        #yt-iframe-container { width: 340px; height: 191px; }

        @media (max-width: 560px) {
            .show-item { grid-template-columns: 120px 1fr; }
            .show-venue-name { text-align: left; grid-column: 2; margin-top: -8px; }
            .artist-avatar { width: 32px; height: 32px; }
            .config-label { min-width: 80px; }
            #yt-player-card { width: calc(100vw - 32px); right: 16px; }
            #yt-iframe-container { width: 100%; }
        }
    </style>
</head>
<script>
    (function() {
        var t = localStorage.getItem('shows-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
    })();
</script>
<body>
    <div class="page-card">
        <div class="page-header">
            <a href="/" class="back-btn">&#8592; Back</a>
            <h1>Upcoming Shows</h1>
            <button class="theme-toggle-btn" id="themeToggle">☀ Light</button>
        </div>

        <!-- City + venue config -->
        <div class="config-section">
            <div class="config-row">
                <span class="config-label">City:</span>
                <select class="city-select" id="citySelect">
                    <option value="Atlanta">Atlanta</option>
                </select>
                <button class="add-btn" id="addCityBtn" title="Add new city">+</button>
                <div class="inline-add" id="addCityInline">
                    <input type="text" id="addCityInput" placeholder="City name" maxlength="80">
                    <button class="inline-confirm-btn" id="addCityConfirm">Add</button>
                    <button class="inline-cancel-btn" id="addCityCancel">Cancel</button>
                </div>
            </div>
            <div class="config-row">
                <span class="config-label">Venues:</span>
                <div class="dropdown-wrapper" id="scrapeDropdownWrapper">
                    <button class="dropdown-trigger" id="scrapeTrigger">
                        <span id="scrapeLabel">Loading&hellip;</span>
                        <span class="arrow">&#9660;</span>
                    </button>
                    <div class="dropdown-panel" id="scrapePanel">
                        <div id="scrapeVenueList"></div>
                        <div class="scrape-venue-count" id="scrapeVenueCount"></div>
                    </div>
                </div>
                <button class="add-btn" id="addVenueBtn" title="Add venue to this city">+</button>
                <div class="inline-add" id="addVenueInline">
                    <input type="text" id="addVenueInput" placeholder="Venue ID or Spotify URL">
                    <button class="inline-confirm-btn" id="addVenueConfirm">Add</button>
                    <button class="inline-cancel-btn" id="addVenueCancel">Cancel</button>
                </div>
                <button id="triggerScrapeBtn" title="Run the scraper now" style="margin-left:8px;background:#1DB954;color:#fff;border:none;font-size:13px;padding:6px 12px;">&#9654; Check for Updates</button>
                <span id="triggerScrapeStatus" style="font-size:12px;color:var(--text-muted);margin-left:6px;"></span>
            </div>
        </div>

        <!-- Venue filter -->
        <div class="filter-section">
            <span class="filter-label">Filter:</span>
            <div class="dropdown-wrapper" id="dropdownWrapper">
                <button class="dropdown-trigger" id="dropdownTrigger">
                    <span id="dropdownLabel">All Venues</span>
                    <span class="arrow">&#9660;</span>
                </button>
                <div class="dropdown-panel" id="dropdownPanel">
                    <div class="dropdown-controls">
                        <button class="dropdown-ctrl-btn" id="selectAllBtn">Select All</button>
                        <button class="dropdown-ctrl-btn" id="clearAllBtn">Clear All</button>
                    </div>
                    <div id="venueCheckboxes"></div>
                </div>
            </div>
            <span id="ytStatusNote" style="font-size:12px;color:var(--text-muted);">▶ YouTube audio</span>
        </div>

        <div id="showsMeta" class="shows-meta"></div>
        <div id="showsContainer"></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Floating YouTube player -->
    <div id="yt-player-card">
        <div class="yt-player-header">
            <div class="yt-now-playing-info">
                <div class="yt-artist-name" id="ytArtistName">—</div>
                <div class="yt-song-name" id="ytSongName">—</div>
            </div>
            <div class="yt-header-btns">
                <button class="yt-ctrl-btn accent" id="ytPlayPauseBtn" title="Play/Pause">⏸</button>
                <button class="yt-ctrl-btn" id="ytToggleVideo" title="Show video">▪</button>
                <button class="yt-ctrl-btn" id="ytCloseBtn" title="Close">✕</button>
            </div>
        </div>
        <div class="yt-video-wrap collapsed" id="ytVideoWrap">
            <div id="yt-iframe-container"></div>
        </div>
    </div>

    <script>
    (function () {
        // ── Theme ─────────────────────────────────────────────────────────────
        const themeToggle = document.getElementById('themeToggle');
        function applyTheme(t) {
            document.documentElement.setAttribute('data-theme', t);
            themeToggle.textContent = t === 'dark' ? '☀ Light' : '☾ Dark';
            localStorage.setItem('shows-theme', t);
        }
        applyTheme(localStorage.getItem('shows-theme') || 'dark');
        themeToggle.addEventListener('click', () => {
            applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        });

        // ── Toast ─────────────────────────────────────────────────────────────
        let toastTimer = null;
        function showToast(msg, ms = 3000) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), ms);
        }

        // ── State ─────────────────────────────────────────────────────────────
        let allShows = [];
        let allApiVenues = [];
        let venues = [];
        let selectedVenueIds = new Set();
        let artistTopSongs = {};

        let cityVenueData = [];
        let selectedCity = 'Atlanta';

        // ── Helpers ───────────────────────────────────────────────────────────
        function extractVenueId(raw) {
            raw = raw.trim();
            const urlMatch = raw.match(/open\.spotify\.com\/venue\/([A-Za-z0-9]+)/);
            if (urlMatch) return urlMatch[1];
            const uriMatch = raw.match(/spotify:venue:([A-Za-z0-9]+)/);
            if (uriMatch) return uriMatch[1];
            if (/^[A-Za-z0-9]{10,30}$/.test(raw)) return raw;
            return null;
        }

        function escHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

        function parseDate(datetime) {
            const datePart = datetime.split('T')[0];
            const [year, month, day] = datePart.split('-').map(Number);
            const d = new Date(Date.UTC(year, month - 1, day));
            return {
                monthStr:  MONTHS[d.getUTCMonth()],
                dayNum:    d.getUTCDate(),
                dayOfWeek: DAYS[d.getUTCDay()],
                year:      d.getUTCFullYear()
            };
        }

        function getTodayUtc() {
            const now = new Date();
            return Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
        }

        function isUpcoming(show) {
            const [year, month, day] = show.datetime.split('T')[0].split('-').map(Number);
            return Date.UTC(year, month - 1, day) >= getTodayUtc();
        }

        // ── City / venue config ───────────────────────────────────────────────
        function currentCityVenues() {
            const entry = cityVenueData.find(e => e.city === selectedCity);
            return entry ? entry.venues : [];
        }

        function renderScrapeVenues() {
            const list    = document.getElementById('scrapeVenueList');
            const countEl = document.getElementById('scrapeVenueCount');
            const labelEl = document.getElementById('scrapeLabel');
            const cityVenues = currentCityVenues();

            labelEl.textContent = cityVenues.length === 0
                ? 'No venues configured'
                : `${cityVenues.length} venue${cityVenues.length !== 1 ? 's' : ''}`;

            list.innerHTML = '';
            if (cityVenues.length === 0) {
                list.innerHTML = '<div style="padding:10px 14px;font-size:13px;color:#888;">No venues — use + to add one</div>';
                countEl.textContent = '';
                return;
            }

            const sorted = [...cityVenues].sort((a, b) => (a.name || a.id).localeCompare(b.name || b.id));
            sorted.forEach(v => {
                const row = document.createElement('div');
                row.className = 'scrape-venue-item';

                const name = document.createElement('span');
                name.className = 'scrape-venue-name';
                name.textContent = v.name || '(unnamed)';
                name.title = v.name || '';

                const idSpan = document.createElement('span');
                idSpan.className = 'scrape-venue-id';
                idSpan.textContent = v.id;
                idSpan.title = v.id;

                row.appendChild(name);
                row.appendChild(idSpan);
                list.appendChild(row);
            });

            countEl.textContent = `${cityVenues.length} venue${cityVenues.length !== 1 ? 's' : ''} in ${selectedCity}`;
        }

        function populateCitySelect() {
            const sel = document.getElementById('citySelect');
            const currentVal = sel.value || selectedCity;
            sel.innerHTML = '';
            cityVenueData.forEach(e => {
                const opt = document.createElement('option');
                opt.value = e.city;
                opt.textContent = e.city;
                sel.appendChild(opt);
            });
            if (cityVenueData.find(e => e.city === currentVal)) sel.value = currentVal;
            else if (cityVenueData.length > 0) sel.value = cityVenueData[0].city;
            selectedCity = sel.value;
        }

        async function loadCityVenues() {
            try {
                const res = await fetch('/api/city-venues');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                cityVenueData = await res.json();
                populateCitySelect();
                renderScrapeVenues();
            } catch (err) {
                console.error('Failed to load city venues:', err);
                document.getElementById('scrapeLabel').textContent = 'Error loading';
            }
        }

        function rebuildVenuesForCity() {
            const cityVenues = currentCityVenues();
            const apiVenueById = new Map(allApiVenues.map(v => [v.id, v]));

            if (cityVenues.length > 0) {
                venues = cityVenues
                    .map(v => {
                        const api = apiVenueById.get(v.id);
                        const name = v.name || api?.name || null;
                        return name ? { id: v.id, name, displayName: name } : null;
                    })
                    .filter(Boolean)
                    .sort((a, b) => a.displayName.localeCompare(b.displayName));

                if (venues.length === 0) {
                    venues = cityVenues.map((v, i) => ({ id: v.id, name: v.id, displayName: `Venue ${i + 1}` }));
                }
            } else {
                venues = [...allApiVenues];
            }

            selectedVenueIds = new Set(venues.map(v => v.id));
            buildVenueCheckboxes();
            updateDropdownLabel();
            renderShows();
        }

        // City select change
        document.getElementById('citySelect').addEventListener('change', function () {
            selectedCity = this.value;
            renderScrapeVenues();
            loadShows(`/api/shows/${encodeURIComponent(selectedCity)}`);
        });

        // Scrape venues dropdown
        const scrapeTrigger = document.getElementById('scrapeTrigger');
        const scrapePanel   = document.getElementById('scrapePanel');
        const scrapeWrapper = document.getElementById('scrapeDropdownWrapper');

        scrapeTrigger.addEventListener('click', e => {
            e.stopPropagation();
            const open = scrapePanel.classList.toggle('open');
            scrapeTrigger.classList.toggle('open', open);
        });
        scrapePanel.addEventListener('click', e => e.stopPropagation());
        scrapeWrapper.addEventListener('click', e => e.stopPropagation());

        // Add city
        const addCityBtn    = document.getElementById('addCityBtn');
        const addCityInline = document.getElementById('addCityInline');
        const addCityInput  = document.getElementById('addCityInput');

        addCityBtn.addEventListener('click', () => {
            addCityInline.classList.toggle('visible');
            if (addCityInline.classList.contains('visible')) addCityInput.focus();
        });
        document.getElementById('addCityCancel').addEventListener('click', () => {
            addCityInline.classList.remove('visible');
            addCityInput.value = '';
        });

        async function submitAddCity() {
            const city = addCityInput.value.trim();
            if (!city) return;
            try {
                const res = await fetch('/api/city-venues', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ city })
                });
                if (res.status === 409) { alert(`"${city}" already exists.`); return; }
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                cityVenueData.push({ city, venues: [] });
                cityVenueData.sort((a, b) => a.city.localeCompare(b.city));
                addCityInput.value = '';
                addCityInline.classList.remove('visible');
                populateCitySelect();
                document.getElementById('citySelect').value = city;
                selectedCity = city;
                renderScrapeVenues();
            } catch (err) { alert('Failed to add city: ' + err.message); }
        }

        document.getElementById('addCityConfirm').addEventListener('click', submitAddCity);
        addCityInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitAddCity(); });

        // Add venue
        const addVenueBtn    = document.getElementById('addVenueBtn');
        const addVenueInline = document.getElementById('addVenueInline');
        const addVenueInput  = document.getElementById('addVenueInput');

        addVenueBtn.addEventListener('click', () => {
            addVenueInline.classList.toggle('visible');
            if (addVenueInline.classList.contains('visible')) addVenueInput.focus();
        });
        document.getElementById('addVenueCancel').addEventListener('click', () => {
            addVenueInline.classList.remove('visible');
            addVenueInput.value = '';
        });

        async function submitAddVenue() {
            const raw = addVenueInput.value.trim();
            const venueId = extractVenueId(raw);
            if (!venueId) {
                alert('Enter a valid Spotify venue ID or URL (e.g. https://open.spotify.com/venue/...).');
                return;
            }
            try {
                const res = await fetch(`/api/city-venues/${encodeURIComponent(selectedCity)}/venues`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ venueId })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const json = await res.json();
                if (!json.already) {
                    const entry = cityVenueData.find(e => e.city === selectedCity);
                    if (entry) entry.venues.push({ id: venueId, name: null });
                }
                addVenueInput.value = '';
                addVenueInline.classList.remove('visible');
                renderScrapeVenues();
            } catch (err) { alert('Failed to add venue: ' + err.message); }
        }

        document.getElementById('addVenueConfirm').addEventListener('click', submitAddVenue);
        addVenueInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitAddVenue(); });

        // Check for updates
        document.getElementById('triggerScrapeBtn').addEventListener('click', async function () {
            const btn    = this;
            const status = document.getElementById('triggerScrapeStatus');
            btn.disabled = true;
            btn.textContent = 'Triggering…';
            status.textContent = '';
            try {
                const res = await fetch('/api/trigger-scrape', { method: 'POST' });
                const json = await res.json();
                if (res.ok) {
                    status.textContent = 'Triggered! Check GitHub Actions for progress.';
                    status.style.color = '#1DB954';
                } else {
                    status.textContent = json.error || 'Failed to trigger.';
                    status.style.color = '#c00';
                }
            } catch (err) {
                status.textContent = 'Network error: ' + err.message;
                status.style.color = '#c00';
            } finally {
                btn.disabled = false;
                btn.textContent = '▶ Check for Updates';
            }
        });

        // ── Venue filter dropdown ─────────────────────────────────────────────
        const filterTrigger = document.getElementById('dropdownTrigger');
        const filterPanel   = document.getElementById('dropdownPanel');

        filterTrigger.addEventListener('click', e => {
            e.stopPropagation();
            const open = filterPanel.classList.toggle('open');
            filterTrigger.classList.toggle('open', open);
        });
        filterPanel.addEventListener('click', e => e.stopPropagation());

        document.addEventListener('click', () => {
            filterPanel.classList.remove('open');
            filterTrigger.classList.remove('open');
            scrapePanel.classList.remove('open');
            scrapeTrigger.classList.remove('open');
        });

        document.getElementById('selectAllBtn').addEventListener('click', () => {
            selectedVenueIds = new Set(venues.map(v => v.id));
            syncCheckboxes(); updateDropdownLabel(); renderShows();
        });
        document.getElementById('clearAllBtn').addEventListener('click', () => {
            selectedVenueIds.clear();
            syncCheckboxes(); updateDropdownLabel(); renderShows();
        });

        function syncCheckboxes() {
            document.querySelectorAll('.venue-cb').forEach(cb => {
                cb.checked = selectedVenueIds.has(cb.dataset.id);
            });
        }

        function updateDropdownLabel() {
            const label = document.getElementById('dropdownLabel');
            if (venues.length === 0) label.textContent = 'No Venues Loaded';
            else if (selectedVenueIds.size === 0) label.textContent = 'No Venues Selected';
            else if (selectedVenueIds.size === venues.length) label.textContent = 'All Venues';
            else label.textContent = `${selectedVenueIds.size} of ${venues.length} Venues`;
        }

        function buildVenueCheckboxes() {
            const container = document.getElementById('venueCheckboxes');
            container.innerHTML = '';
            if (venues.length === 0) {
                container.innerHTML = '<div style="padding:10px 14px;font-size:13px;color:#888;">No venues found</div>';
                return;
            }
            venues.forEach(v => {
                const item = document.createElement('div');
                item.className = 'venue-item';
                const cbId = `vcb-${v.id}`;
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.className = 'venue-cb';
                cb.id = cbId;
                cb.dataset.id = v.id;
                cb.checked = selectedVenueIds.has(v.id);
                cb.addEventListener('change', () => {
                    if (cb.checked) selectedVenueIds.add(v.id);
                    else selectedVenueIds.delete(v.id);
                    updateDropdownLabel(); renderShows();
                });
                const lbl = document.createElement('label');
                lbl.htmlFor = cbId;
                lbl.textContent = v.displayName;
                item.appendChild(cb); item.appendChild(lbl);
                container.appendChild(item);
            });
        }

        // ── YouTube IFrame API ────────────────────────────────────────────────
        let ytPlayer   = null;
        let ytReady    = false;
        let videoShown = false;

        let activeShowIdx    = null;
        let activeArtistName = null;
        const showFallbackState = {};

        window.onYouTubeIframeAPIReady = function () {
            ytPlayer = new YT.Player('yt-iframe-container', {
                width: '340', height: '191',
                playerVars: { autoplay: 1, controls: 1, rel: 0, modestbranding: 1, playsinline: 1 },
                events: {
                    onReady: function () { ytReady = true; },
                    onStateChange: function (e) {
                        const btn = document.getElementById('ytPlayPauseBtn');
                        if (e.data === YT.PlayerState.PLAYING) {
                            btn.textContent = '⏸';
                            document.querySelectorAll('.play-btn').forEach(b => {
                                b.classList.toggle('active', parseInt(b.dataset.idx) === activeShowIdx
                                    && b.dataset.artist === activeArtistName);
                            });
                        } else if (e.data === YT.PlayerState.PAUSED) {
                            btn.textContent = '▶';
                        } else if (e.data === YT.PlayerState.ENDED) {
                            btn.textContent = '▶';
                            document.querySelectorAll('.play-btn').forEach(b => b.classList.remove('active'));
                        }
                    },
                    onError: function () { handleYtError(); }
                }
            });
        };

        function handleYtError() {
            if (activeShowIdx === null) return;
            const state = showFallbackState[activeShowIdx + '|' + activeArtistName];
            if (!state) return;
            const songs = artistTopSongs[state.artistName] || [];
            if (state.attempt === 0 && songs.length > 1) {
                state.attempt = 1;
                searchAndPlay(state.showIdx, state.artistName, songs[1]);
            } else {
                showToast(`⚠ No YouTube audio found for ${state.artistName}`, 3000);
                closePlayer();
                activeShowIdx = null;
                activeArtistName = null;
            }
        }

        async function searchAndPlay(showIdx, artistName, songName) {
            const stateKey = showIdx + '|' + artistName;
            const songs = artistTopSongs[artistName] || [];
            showFallbackState[stateKey] = {
                showIdx, artistName,
                attempt: songName === songs[0] ? 0 : 1
            };

            // Set loading state
            const btn = document.querySelector(`.play-btn[data-idx="${showIdx}"][data-artist="${CSS.escape(artistName)}"]`);
            if (btn) { btn.classList.add('loading'); btn.textContent = '⟳'; }

            let videoId = null;
            try {
                const q = `${artistName} ${songName} official audio`;
                const resp = await fetch(`/api/youtube-search?q=${encodeURIComponent(q)}`);
                const data = await resp.json();
                videoId = data.videoId || null;
            } catch (e) { videoId = null; }

            if (btn) { btn.classList.remove('loading'); btn.textContent = '▶'; }

            if (!videoId) { handleYtError(); return; }

            activeShowIdx    = showIdx;
            activeArtistName = artistName;

            document.getElementById('ytArtistName').textContent = artistName;
            document.getElementById('ytSongName').textContent   = songName;
            document.getElementById('yt-player-card').classList.add('visible');

            if (ytReady && ytPlayer) ytPlayer.loadVideoById(videoId);
        }

        function closePlayer() {
            if (ytReady && ytPlayer) try { ytPlayer.stopVideo(); } catch (e) {}
            document.getElementById('yt-player-card').classList.remove('visible');
            document.querySelectorAll('.play-btn').forEach(b => b.classList.remove('active'));
        }

        document.getElementById('ytPlayPauseBtn').addEventListener('click', () => {
            if (!ytReady || !ytPlayer) return;
            ytPlayer.getPlayerState() === YT.PlayerState.PLAYING
                ? ytPlayer.pauseVideo()
                : ytPlayer.playVideo();
        });

        document.getElementById('ytCloseBtn').addEventListener('click', () => {
            closePlayer();
            activeShowIdx = null;
            activeArtistName = null;
        });

        document.getElementById('ytToggleVideo').addEventListener('click', () => {
            const wrap = document.getElementById('ytVideoWrap');
            const btn  = document.getElementById('ytToggleVideo');
            videoShown = !videoShown;
            wrap.classList.toggle('expanded', videoShown);
            wrap.classList.toggle('collapsed', !videoShown);
            btn.title   = videoShown ? 'Hide video' : 'Show video';
            btn.textContent = videoShown ? '▫' : '▪';
        });

        // ── Shows rendering ───────────────────────────────────────────────────
        function renderShows() {
            const container = document.getElementById('showsContainer');
            const meta      = document.getElementById('showsMeta');

            const visible = allShows.filter(s => selectedVenueIds.has(s.venueId) && isUpcoming(s));

            if (visible.length === 0) {
                meta.textContent = '';
                container.innerHTML = allShows.length === 0
                    ? '<div class="state-msg">No shows loaded yet.</div>'
                    : '<div class="state-msg">No shows match the selected venues.</div>';
                return;
            }

            meta.textContent = `${visible.length} show${visible.length !== 1 ? 's' : ''}`;

            const ul = document.createElement('ul');
            ul.className = 'shows-list';

            visible.forEach((show) => {
                const globalIdx = allShows.indexOf(show);
                const date = parseDate(show.datetime);
                const li = document.createElement('li');
                li.className = 'show-item';
                if (activeShowIdx === globalIdx) li.classList.add('show-item--playing');

                // Date + avatar cell
                const dateCell = document.createElement('div');
                dateCell.className = 'show-date-cell';
                if (show.firstArtistAvatarUrl) {
                    const img = document.createElement('img');
                    img.className = 'artist-avatar';
                    img.src = show.firstArtistAvatarUrl;
                    img.alt = show.artists[0] || '';
                    img.loading = 'lazy';
                    dateCell.appendChild(img);
                }
                const dateDiv = document.createElement('div');
                dateDiv.className = 'show-date';
                dateDiv.innerHTML = `<div class="date-main">${escHtml(date.monthStr)} ${date.dayNum}</div><div class="date-sub">${date.dayOfWeek}, ${date.year}</div>`;
                dateCell.appendChild(dateDiv);
                li.appendChild(dateCell);

                // Artists cell
                const artistsDiv = document.createElement('div');
                artistsDiv.className = 'show-artists';

                show.artists.forEach((name, aIdx) => {
                    const songs = artistTopSongs[name] || [];
                    const chip = document.createElement('span');
                    chip.className = 'artist-chip';

                    if (songs.length > 0) {
                        const btn = document.createElement('button');
                        btn.className = 'play-btn';
                        btn.dataset.idx    = globalIdx;
                        btn.dataset.artist = name;
                        btn.title = `Play: ${songs[0]}`;
                        btn.textContent = '▶';
                        if (activeShowIdx === globalIdx && activeArtistName === name) btn.classList.add('active');

                        btn.addEventListener('click', () => {
                            if (activeShowIdx === globalIdx && activeArtistName === name) {
                                document.getElementById('ytPlayPauseBtn').click();
                                return;
                            }
                            delete showFallbackState[globalIdx + '|' + name];
                            searchAndPlay(globalIdx, name, songs[0]);
                        });
                        chip.appendChild(btn);
                    }

                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = name;
                    if (songs.length === 0) nameSpan.style.color = 'var(--text-secondary)';
                    chip.appendChild(nameSpan);

                    if (aIdx < show.artists.length - 1) {
                        const sep = document.createElement('span');
                        sep.textContent = '·';
                        sep.style.cssText = 'color:var(--text-muted);font-weight:400;margin:0 2px';
                        chip.appendChild(sep);
                    }

                    artistsDiv.appendChild(chip);
                });
                li.appendChild(artistsDiv);

                // Venue cell
                const venueDiv = document.createElement('div');
                venueDiv.className = 'show-venue-name';
                const venueLink = document.createElement('a');
                venueLink.className = 'venue-link';
                venueLink.textContent = show.venue;
                venueLink.href = `https://www.google.com/maps/search/${encodeURIComponent(show.venue + ' ' + selectedCity)}`;
                venueLink.target = '_blank';
                venueLink.rel = 'noopener noreferrer';
                venueDiv.appendChild(venueLink);
                li.appendChild(venueDiv);

                ul.appendChild(li);
            });

            container.innerHTML = '';
            container.appendChild(ul);
        }

        // ── Load shows ────────────────────────────────────────────────────────
        function loadShows(url) {
            document.getElementById('showsContainer').innerHTML =
                '<div class="state-msg"><span class="loading-dots">Loading</span></div>';
            document.getElementById('showsMeta').textContent = '';

            fetch(url)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    allShows = (data.shows || []).map(show => {
                        if (!show.artists) show.artists = show.artist ? [show.artist] : [];
                        if (!show.spotifyArtistIds && show.spotifyArtistId)
                            show.spotifyArtistIds = [show.spotifyArtistId];
                        return show;
                    });

                    artistTopSongs = data.artistTopSongs || {};

                    const rawVenues = data.venues || [];
                    allApiVenues = rawVenues
                        .filter(v => v.name != null)
                        .map(v => ({ id: v.id, name: v.name, displayName: v.name }))
                        .sort((a, b) => a.displayName.localeCompare(b.displayName));

                    if (allApiVenues.length === 0 && rawVenues.length > 0) {
                        allApiVenues = rawVenues.map((v, i) => ({ id: v.id, name: v.id, displayName: `Venue ${i + 1}` }));
                    }

                    if (Object.keys(artistTopSongs).length === 0 && allShows.length > 0) {
                        document.getElementById('ytStatusNote').textContent =
                            '▶ Song data not yet scraped — trigger "Check for Updates" first';
                    } else {
                        document.getElementById('ytStatusNote').textContent = '▶ YouTube audio';
                    }

                    rebuildVenuesForCity();
                })
                .catch(err => {
                    document.getElementById('showsContainer').innerHTML =
                        `<div class="state-msg error">Failed to load shows.<br><small>${escHtml(err.message)}</small></div>`;
                });
        }

        // ── Init ──────────────────────────────────────────────────────────────
        loadCityVenues();
        loadShows(`/api/shows/${encodeURIComponent(selectedCity)}`);
    })();
    </script>

    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
